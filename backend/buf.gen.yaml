version: v2

clean: true


inputs:
  - directory: .
    paths:
      - platform/proto/operator/v1

plugins:
  # generate go code
  #- plugin: buf.build/protocolbuffers/go
  - local: protoc-gen-go
    out: platform/pb
    opt: paths=source_relative # use relative paths

  # generate grpc service code
  #- plugin: buf.build/grpc/go
  - local: protoc-gen-go-grpc
    out: platform/pb
    opt:
      - paths=source_relative # use relative paths

  # generate kratos errors code
  - local: [go, run, ./platform/tools/errorgen]
    strategy: all
    out: platform/pb
    opt:
      - paths=source_relative # use relative paths

  # generate message validator code
  #- plugin: buf.build/bufbuild/validate-go
  - local: protoc-gen-validate
    out: platform/pb
    opt:
      - paths=source_relative # use relative paths
      - lang=go

  # generate redact code
  - local: protoc-gen-go-redact
    out: platform/pb
    opt:
      - paths=source_relative # use relative paths
      - lang=go
