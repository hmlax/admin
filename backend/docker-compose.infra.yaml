name: go-admin

x-runtime: &runtime
  NACOS_ADDR: ${NACOS_ADDR:?set NACOS_ADDR in .env.infra}
  NACOS_GROUP: ${NACOS_GROUP:-GO_ADMIN}
  NACOS_NAMESPACE_ID: ${NACOS_NAMESPACE_ID:-}
  NACOS_USERNAME: ${NACOS_USERNAME:?set NACOS_USERNAME in .env.infra}
  NACOS_PASSWORD: ${NACOS_PASSWORD:?set NACOS_PASSWORD in .env.infra}
  NACOS_CLUSTER: ${NACOS_CLUSTER:-DEFAULT}

services:
  operator:
    image: go-admin/operator:infra-local
    build:
      context: .
      args:
        SERVICE_NAME: operator
        APP_VERSION: infra-local
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [infra]
    expose: ['7790']
    environment:
      <<: *runtime
    volumes:
      - operator-data:/app/data

  admin:
    image: go-admin/admin:infra-local
    build:
      context: .
      args:
        SERVICE_NAME: admin
        APP_VERSION: infra-local
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [infra]
    depends_on: [operator]
    ports:
      - '127.0.0.1:7788:7788'
      - '127.0.0.1:7789:7789'
    environment:
      <<: *runtime
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:7788/admin/v1/sso/login-info']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  infra:
    external: true
    name: infra-network

volumes:
  operator-data:
