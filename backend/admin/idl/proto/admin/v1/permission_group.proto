syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/permission_group_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 权限组管理服务
service PermissionGroupService {
  // 查询权限组列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListPermissionGroupResponse) {
    option (api.get) = "/admin/v1/permission-groups";
  }

  // 查询权限组详情
  rpc Get(admin.v1.GetPermissionGroupRequest) returns (admin.v1.PermissionGroup) {
    option (api.get) = "/admin/v1/permission-groups/:id";
  }

  // 创建权限组
  rpc Create(admin.v1.CreatePermissionGroupRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/permission-groups";
    option (admin.http.body) = "*";
  }

  // 更新权限组
  rpc Update(admin.v1.UpdatePermissionGroupRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/permission-groups/:id";
    option (admin.http.body) = "*";
  }

  // 删除权限组
  rpc Delete(admin.v1.DeletePermissionGroupRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/permission-groups/:id";
  }
}
