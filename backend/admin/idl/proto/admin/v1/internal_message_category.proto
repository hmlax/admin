syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/internal_message_category_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 站内信消息分类管理服务
service InternalMessageCategoryService {
  // 查询站内信消息分类列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListInternalMessageCategoryResponse) {
    option (api.get) = "/admin/v1/internal-message/categories";
  }

  // 查询站内信消息分类详情
  rpc Get(admin.v1.GetInternalMessageCategoryRequest) returns (admin.v1.InternalMessageCategory) {
    option (api.get) = "/admin/v1/internal-message/categories/:id";
  }

  // 创建站内信消息分类
  rpc Create(admin.v1.CreateInternalMessageCategoryRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/internal-message/categories";
    option (admin.http.body) = "*";
  }

  // 更新站内信消息分类
  rpc Update(admin.v1.UpdateInternalMessageCategoryRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/internal-message/categories/:id";
    option (admin.http.body) = "*";
  }

  // 删除站内信消息分类
  rpc Delete(admin.v1.DeleteInternalMessageCategoryRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/internal-message/categories/:id";
  }
}
