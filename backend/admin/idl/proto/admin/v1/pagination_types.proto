syntax = "proto3";

package admin.v1;

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

import "google/protobuf/field_mask.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";

import "gnostic/openapi/v3/annotations.proto";

// 排序规则（分页场景通常需配合排序保证结果稳定）
message Sorting {
  // 排序方向（ASC/DESC，默认ASC）
  enum Direction {
    ASC = 0; // 升序
    DESC = 1; // 降序
  }

  // 排序字段（如"id"、"create_time"）
  string field = 1;

  // 排序方向
  Direction direction = 2;
}

// 过滤条件
message FilterCondition {
  // 过滤字段名
  string field = 1;

  // 过滤操作符
  Operator op = 2;

  oneof value_oneof {
    // 过滤值（单值）
    string value = 3;

    // 当需要使用非字符串类型的比较值（对象/数组/数字/布尔）时使用此字段，
    // 使用 google.protobuf.Value 能表达任意 JSON 值。
    google.protobuf.Value json_value = 7;
  }

  // 过滤值（多值，如IN操作符）
  repeated string values = 4;

  // 日期时间部分（可选，仅在字段为日期时间类型时使用）
  optional DatePart date_part = 5;

  // 当字段为 JSON/JSONB 类型时，可指定要抽取的子路径（例如: "meta.user.name" 或 JSONPath）
  // 服务端应把此路径用于 JSON_EXTRACT / -> 操作，再对抽取结果应用 op。
  optional string json_path = 6;
}

// 过滤表达式
message FilterExpr {
  // 过滤表达式类型
  ExprType type = 1;

  // 条件列表
  repeated FilterCondition conditions = 2;

  // 子表达式列表
  repeated FilterExpr groups = 3;
}

// ------------------------------
// 分页通用请求
// ------------------------------
message PagingRequest {
  // 当前页码（从1开始，默认1）
  optional uint32 page = 1 [
    json_name = "page",
    (gnostic.openapi.v3.property) = {
      description: "当前页码（从1开始，默认1）",
      default: {number: 1}
    }
  ];

  // 每页条数（默认10，建议设置上限如100）
  optional uint32 page_size = 2 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {
      description: "每页条数（默认10，建议设置上限如100）",
      default: {number: 10}
    }
  ];

  // 跳过的记录数（从0开始，默认0）
  optional uint64 offset = 3 [
    json_name = "offset",
    (gnostic.openapi.v3.property) = {
      description: "跳过的记录数（从0开始，默认0）",
      default: {number: 0}
    }
  ];

  // 最多返回的记录数（默认10，建议设置上限如100）
  optional uint32 limit = 4 [
    json_name = "limit",
    (gnostic.openapi.v3.property) = {
      description: "最多返回的记录数（默认10，建议设置上限如100）",
      default: {number: 10}
    }
  ];

  // 上一页最后一条记录的游标（如ID/时间戳+ID，首次请求为空）
  optional string token = 5 [
    json_name = "token",
    (gnostic.openapi.v3.property) = {
      description: "上一页最后一条记录的游标（如ID/时间戳+ID，首次请求为空）",
    }
  ];

  // 是否不分页，如果为true，则page和pageSize参数无效。
  optional bool no_paging = 6 [
    json_name = "noPaging",
    (gnostic.openapi.v3.property) = {
      description: "是否不分页，如果为true，则page和pageSize参数无效。"
    }
  ];

  oneof filtering_type {
    // JSON字符串过滤条件，基础语法：{"field1":"val1", "field2___icontains":"val2"}，具体请参见：https://github.com/tx7do/go-crud/tree/main/pagination/filter/README.md
    string query = 10 [
      json_name = "query",
      (gnostic.openapi.v3.property) = {
        description: "JSON字符串过滤条件，基础语法：{\"key1\":\"val1\",\"key2\":\"val2\"}，具体请参见：https://github.com/tx7do/go-crud/tree/main/pagination/filter/README.md",
        example: {yaml: "{\"field1\":\"val1\", \"field2___icontains\":\"val2\"}"}
      }
    ];

    // Google AIP规范字符串过滤条件
    string filter = 11 [
      json_name = "filter",
      (gnostic.openapi.v3.property) = {
        description: "Google AIP规范字符串过滤条件。"
      }
    ];

    // 复杂过滤表达式（优先使用）
    FilterExpr filter_expr = 12 [
      json_name = "filterExpr",
      (gnostic.openapi.v3.property) = {
        description: "复杂过滤表达式，优先于已弃用的 query/or_query。服务端应以此为准并执行严格校验与参数化。"
      }
    ];
  }

  // 排序条件
  optional string order_by = 20 [
    json_name = "orderBy",
    (gnostic.openapi.v3.property) = {
      description: "排序条件"
      example: {yaml: "{\"val1\", \"-val2\"}"}
    }
  ];

  // 排序规则
  repeated Sorting sorting = 21 [
    json_name = "sorting",
    (gnostic.openapi.v3.property) = {
      description: "排序规则"
    }
  ];

  // 字段掩码，其作用为SELECT中的字段，其语法为使用逗号分隔字段名，例如：id,realName,userName。如果为空则选中所有字段，即SELECT *。
  optional google.protobuf.FieldMask field_mask = 30 [
    json_name = "fieldMask",
    (gnostic.openapi.v3.property) = {
      description: "字段掩码，其作用为SELECT中的字段，其语法为使用逗号分隔字段名，例如：id,realName,userName。如果为空则选中所有字段，即SELECT *。",
      example: {yaml : "id,realName,userName"}
    }
  ];
}

// 操作符枚举
enum Operator {
  // 未指定
  OPERATOR_UNSPECIFIED = 0;

  // 基本比较
  EQ = 1;        // =
  NEQ = 2;       // !=
  GT = 3;        // >
  GTE = 4;       // >=
  LT = 5;        // <
  LTE = 6;       // <=

  // 模糊 / 大小写不敏感模糊 / 非模糊
  LIKE = 7;      // SQL LIKE
  ILIKE = 8;     // 大小写不敏感的 LIKE（如 Postgres ILIKE）
  NOT_LIKE = 9;  // NOT LIKE

  // 集合操作
  IN = 10;       // IN (v1, v2, ...)
  NIN = 11;      // NOT IN

  // 空值判断
  IS_NULL = 12;      // IS NULL
  IS_NOT_NULL = 13;  // IS NOT NULL

  // 范围与正则
  BETWEEN = 14;   // BETWEEN a AND b（或服务端映射为 >=a AND <=b）
  REGEXP = 15;    // 正则匹配（DB/引擎支持）
  IREGEXP = 16;    // 不区分大小写的正则匹配

  // 语义化的字符串操作
  CONTAINS = 17;     // 包含（等价于 LIKE %v%）
  STARTS_WITH = 18;  // 前缀（等价于 LIKE v%）
  ENDS_WITH = 19;    // 后缀（等价于 LIKE %v）
  ICONTAINS = 20;     // 不区分大小写的包含
  ISTARTS_WITH = 21; // 不区分大小写的前缀匹配
  IENDS_WITH = 22;   // 不区分大小写的后缀匹配

  // JSON / 数组 / 集合相关（按需在服务端映射为具体 DB 运算）
  JSON_CONTAINS = 23;   // JSON 包含（如 Postgres/ MySQL 的 JSON 包含）
  ARRAY_CONTAINS = 24;  // 数组包含某元素
  EXISTS = 25;          // 子查询 / 存在性（按需实现）

  SEARCH = 26;       // 全文/模糊搜索（服务端按需实现）
  EXACT = 27;        // 精确匹配（完全相等）
  IEXACT = 28;        // 不区分大小写的精确匹配
}

// 日期时间部分枚举
enum DatePart {
  DATE_PART_UNSPECIFIED = 0;

  DATE = 1; // 日期
  YEAR = 2; // 年
  ISO_YEAR = 3; // ISO 8601 一年中的周数
  QUARTER = 4; // 季度
  MONTH = 5; // 月
  WEEK = 6; // ISO 8601 周编号 一年中的周数
  WEEK_DAY = 7; // 星期几
  ISO_WEEK_DAY = 8; // ISO 8601 星期几
  DAY = 9; // 日
  TIME = 10; // 时间（小时:分钟:秒）
  HOUR = 11; // 小时
  MINUTE = 12; // 分钟
  SECOND = 13; // 秒
  MICROSECOND = 14; // 微秒
}

// 过滤表达式类型
enum ExprType {
  EXPR_TYPE_UNSPECIFIED = 0;

  AND = 1;
  OR = 2;
}
