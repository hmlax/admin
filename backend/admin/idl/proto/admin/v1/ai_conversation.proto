syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/ai_conversation_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// AI 对话会话管理服务
service AiConversationService {
  // 分页查询会话列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListAiConversationResponse) {
    option (api.get) = "/admin/v1/ai/conversations";
  }

  // 查询会话详情
  rpc Get(admin.v1.GetAiConversationRequest) returns (admin.v1.AiConversation) {
    option (api.get) = "/admin/v1/ai/conversations/:id";
  }

  // 更新会话（改标题）
  rpc Update(admin.v1.UpdateAiConversationRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/ai/conversations/:id";
    option (admin.http.body) = "*";
  }

  // 删除会话
  rpc Delete(admin.v1.DeleteAiConversationRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/ai/conversations/:id";
  }
}
