syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/ai_content_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// AI 内容生成服务（表单助手）
service AiContentService {
  // 生成内容
  rpc GenerateContent(admin.v1.GenerateContentRequest) returns (admin.v1.GenerateContentResponse) {
    option (api.post) = "/admin/v1/ai/content/generate";
    option (admin.http.body) = "*";
  }

  // 语义搜索（菜单等可导航条目）
  rpc SemanticSearch(admin.v1.SemanticSearchRequest) returns (admin.v1.SemanticSearchResponse) {
    option (api.post) = "/admin/v1/ai/content/search";
    option (admin.http.body) = "*";
  }

  // 重建搜索索引
  rpc RebuildSearchIndex(google.protobuf.Empty) returns (admin.v1.RebuildSearchIndexResponse) {
    option (api.post) = "/admin/v1/ai/content/rebuild-index";
  }
}
