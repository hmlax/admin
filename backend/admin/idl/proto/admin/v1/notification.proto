syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "admin/v1/notification_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 通知投递台账管理服务（平台级只读视图）。
//
// 本域不含"发一条通知"的通用 HTTP 路由：SendDirect 只由进程内的业务 service 经 Notifier 接口调用。
// 把它开放成端点等于给任意已登录操作员一个"向任意邮箱发信"的能力。
// 两个刻意保留的手动触发口都是平台管理员专属、且只能发"测试文案"：
// 渠道配置页的 send-test-email，与路由规则页的 notification-rules/{id}/test-dispatch。
service NotificationService {
  // 查询投递台账列表
  rpc ListNotificationDelivery(admin.v1.PagingRequest) returns (admin.v1.ListNotificationDeliveryResponse) {
    option (api.get) = "/admin/v1/notification-deliveries";
  }

  // 查询投递台账详情
  rpc GetNotificationDelivery(admin.v1.GetNotificationDeliveryRequest) returns (admin.v1.NotificationDelivery) {
    option (api.get) = "/admin/v1/notification-deliveries/:id";
  }
}
