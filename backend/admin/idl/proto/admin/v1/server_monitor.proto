syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "admin/v1/server_monitor_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 服务监控管理服务（只读）
service ServerMonitorService {
  // 查询服务监控信息
  rpc Get(admin.v1.GetServerMonitorRequest) returns (admin.v1.ServerMonitorInfo) {
    option (api.get) = "/admin/v1/server-monitor";
  }
}
