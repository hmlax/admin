syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/ai_knowledge_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// AI 知识库管理服务（RAG）
service AiKnowledgeBaseService {
  // 分页查询知识库列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListAiKnowledgeBaseResponse) {
    option (api.get) = "/admin/v1/ai/knowledge-bases";
  }

  // 查询知识库详情
  rpc Get(admin.v1.GetAiKnowledgeBaseRequest) returns (admin.v1.AiKnowledgeBase) {
    option (api.get) = "/admin/v1/ai/knowledge-bases/:id";
  }

  // 创建知识库
  rpc Create(admin.v1.CreateAiKnowledgeBaseRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/ai/knowledge-bases";
    option (admin.http.body) = "*";
  }

  // 更新知识库
  rpc Update(admin.v1.UpdateAiKnowledgeBaseRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/ai/knowledge-bases/:id";
    option (admin.http.body) = "*";
  }

  // 删除知识库
  rpc Delete(admin.v1.DeleteAiKnowledgeBaseRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/ai/knowledge-bases/:id";
  }

  // 上传文档（纯文本：切片 → 向量化 → 落库）
  rpc UploadDoc(admin.v1.UploadAiDocRequest) returns (admin.v1.UploadAiDocResponse) {
    option (api.post) = "/admin/v1/ai/knowledge-bases/:base_id/docs";
    option (admin.http.body) = "*";
  }

  // 上传文档文件（txt/md/docx/pdf：抽取文本后入库）
  rpc UploadDocFile(admin.v1.UploadAiDocFileRequest) returns (admin.v1.UploadAiDocResponse) {
    option (api.post) = "/admin/v1/ai/knowledge-bases/:base_id/docs/file";
    option (admin.http.body) = "*";
  }

  // 查询知识库下的文档
  rpc ListDocs(admin.v1.ListAiDocsRequest) returns (admin.v1.ListAiDocsResponse) {
    option (api.get) = "/admin/v1/ai/knowledge-bases/:base_id/docs";
  }

  // 删除文档
  rpc DeleteDoc(admin.v1.DeleteAiDocRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/ai/knowledge-bases/:base_id/docs/:id";
  }

  // 检索测试
  rpc Search(admin.v1.SearchAiKnowledgeRequest) returns (admin.v1.SearchAiKnowledgeResponse) {
    option (api.post) = "/admin/v1/ai/knowledge-bases/:base_id/search";
    option (admin.http.body) = "*";
  }
}
