syntax = "proto3";

package admin.v1;

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

import "google/protobuf/empty.proto";
import "admin/v1/menu_types.proto";

// 查询路由列表 - 回应
message ListRouteResponse {
  repeated admin.v1.MenuRouteItem items = 1;
}

// 查询权限码列表 - 回应
message ListPermissionCodeResponse {
  repeated string codes = 1;
  repeated string hidden_fields = 2 [json_name = "hiddenFields"]; // 字段权限隐藏字段集（"资源.字段" 串，供前端列显隐）
  repeated ApiGrant api_permissions = 3 [json_name = "apiPermissions"]; // 当前角色实际获准的 HTTP 操作
}

message ApiGrant {
  string path = 1;
  string method = 2;
}

message InitialContextResponse {
  repeated admin.v1.MenuRouteItem menus = 1;  // 菜单树
  repeated string permissions = 2;   // 权限码
  repeated string hidden_fields = 3 [json_name = "hiddenFields"]; // 字段权限隐藏字段集（"资源.字段" 串）
  repeated ApiGrant api_permissions = 4 [json_name = "apiPermissions"];
}
