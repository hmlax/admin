syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "admin/v1/redis_cache_monitor_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// Redis缓存监控管理服务（只读）
service RedisCacheMonitorService {
  // 查询Redis缓存监控信息
  rpc Get(admin.v1.GetRedisCacheMonitorRequest) returns (admin.v1.RedisCacheMonitorInfo) {
    option (api.get) = "/admin/v1/redis-cache-monitor";
  }
}
