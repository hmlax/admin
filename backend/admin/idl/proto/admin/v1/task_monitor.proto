syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "admin/v1/task_monitor_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 系统级常驻任务监控服务（平台管理员；只读 asynq Inspector，无副作用）。
service TaskMonitorService {
  // 一站式巡检：调度条目（cron/上次/下次入队）+ 各任务类型的队列状态与失败明细
  rpc InspectSystemTasks(admin.v1.InspectSystemTasksRequest) returns (admin.v1.InspectSystemTasksResponse) {
    option (api.post) = "/admin/v1/system-tasks:inspect";
    option (admin.http.body) = "*";
  }
}
