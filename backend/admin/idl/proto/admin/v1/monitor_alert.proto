syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/monitor_alert_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 监控告警规则服务（平台管理员）
service MonitorAlertService {
  // 规则列表（分页，contains 搜索）
  rpc ListMonitorAlertRule(admin.v1.PagingRequest) returns (admin.v1.ListMonitorAlertRuleResponse) {
    option (api.get) = "/admin/v1/monitor-alert-rules";
  }

  // 规则详情
  rpc GetMonitorAlertRule(admin.v1.GetMonitorAlertRuleRequest) returns (admin.v1.MonitorAlertRule) {
    option (api.get) = "/admin/v1/monitor-alert-rules/:id";
  }

  // 新建规则
  rpc CreateMonitorAlertRule(admin.v1.CreateMonitorAlertRuleRequest) returns (admin.v1.MonitorAlertRule) {
    option (api.post) = "/admin/v1/monitor-alert-rules";
    option (admin.http.body) = "*";
  }

  // 更新规则
  rpc UpdateMonitorAlertRule(admin.v1.UpdateMonitorAlertRuleRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/monitor-alert-rules/:id";
    option (admin.http.body) = "*";
  }

  // 删除规则
  rpc DeleteMonitorAlertRule(admin.v1.DeleteMonitorAlertRuleRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/monitor-alert-rules/:id";
  }

  // 立即评估一轮（与周期扫描同一内核），返回各启用规则的求值结论
  rpc EvaluateMonitorAlerts(admin.v1.EvaluateMonitorAlertsRequest) returns (admin.v1.EvaluateMonitorAlertsResponse) {
    option (api.post) = "/admin/v1/monitor-alert-rules:evaluate";
    option (admin.http.body) = "*";
  }
}
