syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "admin/v1/operation_audit_log_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 操作审计日志管理服务
service OperationAuditLogService {
  // 查询操作审计日志列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListOperationAuditLogResponse) {
    option (api.get) = "/admin/v1/operation-audit-logs";
  }

  // 查询操作审计日志详情
  rpc Get(admin.v1.GetOperationAuditLogRequest) returns (admin.v1.OperationAuditLog) {
    option (api.get) = "/admin/v1/operation-audit-logs/:id";
  }
}
