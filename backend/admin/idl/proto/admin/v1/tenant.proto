syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/tenant_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 租户管理服务
service TenantService {
  // 获取租户列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListTenantResponse) {
    option (api.get) = "/admin/v1/tenants";
  }

  // 获取租户数据
  rpc Get(admin.v1.GetTenantRequest) returns (admin.v1.Tenant) {
    option (api.get) = "/admin/v1/tenants/:id";
  }

  // 创建租户
  rpc Create(admin.v1.CreateTenantRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/tenants";
    option (admin.http.body) = "*";
  }

  // 更新租户
  rpc Update(admin.v1.UpdateTenantRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/tenants/:id";
    option (admin.http.body) = "*";
  }

  // 删除租户
  rpc Delete(admin.v1.DeleteTenantRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/tenants/:id";
  }

  // 创建租户及管理员用户
  rpc CreateTenantWithAdminUser(admin.v1.CreateTenantWithAdminUserRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/tenants:with-admin";
    option (admin.http.body) = "*";
  }

  // 租户是否存在
  rpc TenantExists(admin.v1.TenantExistsRequest) returns (admin.v1.TenantExistsResponse) {
    option (api.get) = "/admin/v1/tenants:exists";
  }

  // 查询租户用量与配额
  rpc GetUsage(admin.v1.GetTenantUsageRequest) returns (admin.v1.TenantUsage) {
    option (api.get) = "/admin/v1/tenants/:id/usage";
  }

  // 清理租户数据
  rpc CleanupData(admin.v1.CleanupTenantDataRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/tenants/:id/cleanup";
    option (admin.http.body) = "*";
  }
}
