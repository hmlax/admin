syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/ai_usage_log_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// AI 用量流水服务（配额记账事实源）
service AiUsageLogService {
  // 分页查询用量流水
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListAiUsageLogResponse) {
    option (api.get) = "/admin/v1/ai/usage-logs";
  }

  // 当月用量汇总（tokens/调用量/配额上限）
  rpc GetUsageSummary(google.protobuf.Empty) returns (admin.v1.UsageSummaryResponse) {
    option (api.get) = "/admin/v1/ai/usage-summary";
  }
}
