syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/permission_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 权限点管理服务
service PermissionService {
  // 查询权限点列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListPermissionResponse) {
    option (api.get) = "/admin/v1/permissions";
  }

  // 查询权限点详情
  rpc Get(admin.v1.GetPermissionRequest) returns (admin.v1.Permission) {
    option (api.get) = "/admin/v1/permissions/:id";
  }

  // 创建权限点
  rpc Create(admin.v1.CreatePermissionRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/permissions";
    option (admin.http.body) = "*";
  }

  // 更新权限点
  rpc Update(admin.v1.UpdatePermissionRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/permissions/:id";
    option (admin.http.body) = "*";
  }

  // 删除权限点
  rpc Delete(admin.v1.DeletePermissionRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/permissions/:id";
  }

  // 同步权限点
  rpc SyncPermissions(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/permissions/sync:perms";
    option (admin.http.body) = "*";
  }
}
