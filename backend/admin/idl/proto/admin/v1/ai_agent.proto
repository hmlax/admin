syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/ai_agent_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// AI Agent 编排管理服务（可视化画布）
service AiAgentService {
  // 分页查询 Agent 应用列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListAiAgentAppsResponse) {
    option (api.get) = "/admin/v1/ai/agents";
  }

  // 查询 Agent 应用详情
  rpc Get(admin.v1.GetAiAgentAppRequest) returns (admin.v1.AiAgentApp) {
    option (api.get) = "/admin/v1/ai/agents/:id";
  }

  // 创建 Agent 应用
  rpc Create(admin.v1.CreateAiAgentAppRequest) returns (admin.v1.AiAgentApp) {
    option (api.post) = "/admin/v1/ai/agents";
    option (admin.http.body) = "*";
  }

  // 更新 Agent 应用
  rpc Update(admin.v1.UpdateAiAgentAppRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/ai/agents/:id";
    option (admin.http.body) = "*";
  }

  // 删除 Agent 应用
  rpc Delete(admin.v1.DeleteAiAgentAppRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/ai/agents/:id";
  }

  // 试运行（同步执行图，返回含 trace 的运行记录）
  rpc Run(admin.v1.RunAiAgentAppRequest) returns (admin.v1.AiAgentRun) {
    option (api.post) = "/admin/v1/ai/agents/:id/run";
    option (admin.http.body) = "*";
  }

  // 查询运行台账（appId eq 过滤走 PagingRequest；独立集合路径，避免与 /{id} 参数路由抢配）
  rpc ListRuns(admin.v1.PagingRequest) returns (admin.v1.ListAiAgentRunsResponse) {
    option (api.get) = "/admin/v1/ai/agent-runs";
  }

  // 查询运行详情（含 trace JSON）
  rpc GetRun(admin.v1.GetAiAgentRunRequest) returns (admin.v1.AiAgentRun) {
    option (api.get) = "/admin/v1/ai/agent-runs/:id";
  }
}
