syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/ai_message_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// AI 对话消息服务
service AiMessageService {
  // 分页查询消息列表（按 conversationId 过滤；ID 类字段精确匹配，不走模糊搜索）
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListAiMessageResponse) {
    option (api.get) = "/admin/v1/ai/messages";
  }

  // 删除消息
  rpc Delete(admin.v1.DeleteAiMessageRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/ai/messages/:id";
  }
}
