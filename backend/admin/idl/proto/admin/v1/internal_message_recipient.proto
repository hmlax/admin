syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/internal_message_recipient_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 站内信消息管理服务
service InternalMessageRecipientService {
  // 获取用户的收件箱列表 (通知类)
  rpc ListUserInbox(admin.v1.PagingRequest) returns (admin.v1.ListUserInboxResponse) {
    option (api.get) = "/admin/v1/internal-message/inbox";
  }

  // 删除用户收件箱中的通知记录
  rpc DeleteNotificationFromInbox(admin.v1.DeleteNotificationFromInboxRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/internal-message/inbox/delete";
    option (admin.http.body) = "*";
  }

  // 将通知标记为已读
  rpc MarkNotificationAsRead(admin.v1.MarkNotificationAsReadRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/internal-message/read";
    option (admin.http.body) = "*";
  }

  // 标记通知投递回执（SENT→RECEIVED；服务端写入即 RECEIVED，此端点为回执补偿通道）
  rpc MarkNotificationsStatus(admin.v1.MarkNotificationsStatusRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/internal-message/status";
    option (admin.http.body) = "*";
  }
}
