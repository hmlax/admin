syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/notification_rule_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 通知路由规则管理服务（平台级配置，菜单 authority 为 sys:platform_admin）。
service NotificationRuleService {
  // 查询路由规则列表
  rpc ListNotificationRule(admin.v1.PagingRequest) returns (admin.v1.ListNotificationRuleResponse) {
    option (api.get) = "/admin/v1/notification-rules";
  }

  // 查询路由规则详情
  rpc GetNotificationRule(admin.v1.GetNotificationRuleRequest) returns (admin.v1.NotificationRule) {
    option (api.get) = "/admin/v1/notification-rules/:id";
  }

  // 创建路由规则
  rpc CreateNotificationRule(admin.v1.CreateNotificationRuleRequest) returns (admin.v1.NotificationRule) {
    option (api.post) = "/admin/v1/notification-rules";
    option (admin.http.body) = "*";
  }

  // 更新路由规则
  rpc UpdateNotificationRule(admin.v1.UpdateNotificationRuleRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/notification-rules/:id";
    option (admin.http.body) = "*";
  }

  // 删除路由规则
  rpc DeleteNotificationRule(admin.v1.DeleteNotificationRuleRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/notification-rules/:id";
  }

  // 测试投递：按这条规则当场走一遍完整投递链
  rpc TestDispatchNotification(admin.v1.TestDispatchNotificationRequest) returns (admin.v1.TestDispatchNotificationResponse) {
    option (api.post) = "/admin/v1/notification-rules/:id/test-dispatch";
    option (admin.http.body) = "*";
  }
}
