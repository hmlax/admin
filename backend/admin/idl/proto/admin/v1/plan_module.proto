syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/plan_module_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 套餐模块白名单管理服务
service PlanModuleService {
  // 分页查询套餐模块列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListPlanModuleResponse) {
    option (api.get) = "/admin/v1/plan-modules";
  }

  // 查询套餐模块详情
  rpc Get(admin.v1.GetPlanModuleRequest) returns (admin.v1.PlanModule) {
    option (api.get) = "/admin/v1/plan-modules/:id";
  }

  // 创建套餐模块
  rpc Create(admin.v1.CreatePlanModuleRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/plan-modules";
    option (admin.http.body) = "*";
  }

  // 更新套餐模块
  rpc Update(admin.v1.UpdatePlanModuleRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/plan-modules/:id";
    option (admin.http.body) = "*";
  }

  // 删除套餐模块
  rpc Delete(admin.v1.DeletePlanModuleRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/plan-modules";
  }
}
