syntax = "proto3";

package admin.v1;

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// Raw HTTP file response. content is the actual response body; the remaining
// fields are mapped to HTTP status and headers by the API transport encoder.
message BinaryFileResponse {
  bytes content = 1;
  string content_type = 2 [json_name = "contentType"];
  string disposition = 3;
  int32 status = 4;
  string cache_control = 5 [json_name = "cacheControl"];
}

// Error body used by the HTTP transport for binding, authorization and RPC errors.
message HTTPErrorResponse {
  int32 code = 1;
  string reason = 2;
  string message = 3;
  map<string, string> metadata = 4;
}
