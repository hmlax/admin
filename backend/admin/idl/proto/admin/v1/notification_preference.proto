syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/notification_preference_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 用户通知偏好服务（自助：读写的都是当前操作人自己的偏好，无管理面）。
service NotificationPreferenceService {
  // 获取当前用户的通知偏好；从未配置过时返回默认值（未启用静音、无退订）。
  rpc GetMyNotificationPreference(google.protobuf.Empty) returns (admin.v1.NotificationPreference) {
    option (api.get) = "/admin/v1/notification-preference";
  }

  // 更新当前用户的通知偏好，返回保存后的完整状态。
  rpc UpdateMyNotificationPreference(admin.v1.UpdateNotificationPreferenceRequest) returns (admin.v1.NotificationPreference) {
    option (api.post) = "/admin/v1/notification-preference";
    option (admin.http.body) = "*";
  }

  // 当前用户可退订的启用分类清单（本租户内）。
  rpc ListMyNotificationCategories(google.protobuf.Empty) returns (admin.v1.ListMyNotificationCategoriesResponse) {
    option (api.get) = "/admin/v1/notification-preference/categories";
  }
}
