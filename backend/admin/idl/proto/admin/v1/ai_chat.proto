syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "admin/v1/ai_chat_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// AI 对话服务
//
// 流式语义：本 RPC 是普通 POST（body 为扁平请求体，**不包 data**），
// 增量 token 经 SSE `ai_chat_chunk` 事件推送（见 domain proto 注释）。
service AiChatService {
  // 发起一轮对话
  rpc Chat(admin.v1.ChatRequest) returns (admin.v1.ChatResponse) {
    option (api.post) = "/admin/v1/ai/chat/completions";
    option (admin.http.body) = "*";
  }
}
