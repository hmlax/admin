syntax = "proto3";

package admin.v1;

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";


// 投递渠道
message Channel {
enum Channel {
  CHANNEL_UNSPECIFIED = 0; // 未指定：由 event_type 的路由规则决定
  EMAIL = 1;               // 邮件（SMTP）
  SMS = 2;                 // 短信（阿里云/腾讯云：验证码类事件，走渠道行配的审核模板）
  WEBHOOK = 3;             // Webhook（HTTP 回调，P2-C 落地）
  INTERNAL = 4;            // 站内信
  EXT = 5;                 // 扩展渠道（go-utils/notify 全量接入：telegram/wecom_app/bark/ntfy…，
                           // 具体渠道由台账 channel_id → 渠道行的 type 回答）
}
}

// 业务事件类型。路由（事件 → 渠道 / 是否异步）由 sys_notification_rules 表决定，
// 表的初始四行由代码里那份同形常量播种（见 docs/notification_domain_design.md §3.5、§4 P2-C）。
message EventType {
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;

  PASSWORD_RESET_CODE = 1; // 找回密码验证码邮件
  CONTACT_BIND_CODE = 2;   // 邮箱绑定验证码邮件
  CHANNEL_TEST_EMAIL = 3;  // 渠道配置测试邮件

  // 站内信投递：一条站内信发给一个收件人 = 一行台账，related_id 指向 sys_internal_messages.id。
  // 它与其他三个事件的区别：那三个由业务动作触发、渠道由路由表决定；这一个本身就是
  // "站内信内容域经缝投递了一次"，related_id 必填，否则台账行无法回答"发的是哪条消息"。
  INTERNAL_MESSAGE = 4;

  // 监控告警：监控扫描任务对规则求值后触发（explicit channel + target，不经路由表）。
  // related_id 指向 sys_monitor_alert_rules.id。
  MONITOR_ALERT = 5;

  // 渠道配置测试短信（渠道页"测试发送"）：与 CHANNEL_TEST_EMAIL 同因同果，只差渠道。
  CHANNEL_TEST_SMS = 6;

  // 手机号绑定验证码短信：由 SMS 渠道显式投递（调用方带 channel=SMS，不经路由表），
  // 正文来自渠道行配置的审核模板，占位值走 params.code。
  PHONE_BIND_CODE = 7;

  // 渠道测试消息（扩展渠道 EXT_* 的"测试发送"）。
  CHANNEL_TEST_EXT = 8;
}
}

// 投递状态
message DeliveryStatus {
enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;

  SENDING = 1; // 已落台账、正在投递（进程中途崩溃会停在此态，即为排障线索）
  SENT = 2;    // 渠道已接受
  FAILED = 3;  // 渠道报错
  SKIPPED = 4; // 未投递：无可用渠道等路由结果
}
}

// 一条通知 × 一个渠道 × 一个收件人 = 一行投递台账
message NotificationDelivery {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = { description: "台账ID" }
  ]; // 台账ID

  optional EventType.EventType event_type = 2 [
    json_name = "eventType",
    (gnostic.openapi.v3.property) = { description: "业务事件类型" }
  ]; // 业务事件类型

  optional Channel.Channel channel = 3 [
    json_name = "channel",
    (gnostic.openapi.v3.property) = { description: "投递渠道" }
  ]; // 投递渠道

  optional uint32 channel_id = 4 [
    json_name = "channelId",
    (gnostic.openapi.v3.property) = { description: "实际选中的渠道配置ID" }
  ]; // 实际选中的渠道配置ID（sys_notification_channels.id）

  optional uint32 recipient_user_id = 5 [
    json_name = "recipientUserId",
    (gnostic.openapi.v3.property) = { description: "收件用户ID（直发模式可为空）" }
  ]; // 收件用户ID（直发模式可为空）

  // 脱敏后的投递目标（见 MaskTarget）：台账可查，但不得成为明文集邮地址的第二个真相源
  optional string target = 6 [
    json_name = "target",
    (gnostic.openapi.v3.property) = { description: "投递目标（脱敏）" }
  ]; // 投递目标（脱敏）

  optional DeliveryStatus.DeliveryStatus status = 7 [
    json_name = "status",
    (gnostic.openapi.v3.property) = { description: "投递状态" }
  ]; // 投递状态

  optional string last_error = 8 [
    json_name = "lastError",
    (gnostic.openapi.v3.property) = { description: "最近一次失败原因" }
  ]; // 最近一次失败原因

  optional google.protobuf.Timestamp sent_at = 9 [
    json_name = "sentAt",
    (gnostic.openapi.v3.property) = { description: "投递完成时间" }
  ]; // 投递完成时间

  // 产生本条投递的业务对象主键，含义由 event_type 决定（INTERNAL_MESSAGE → sys_internal_messages.id）。
  // 存在的理由：台账不存正文快照（见 §3.3），排障时要能跳回业务对象去看发了什么。
  optional uint32 related_id = 10 [
    json_name = "relatedId",
    (gnostic.openapi.v3.property) = { description: "关联业务对象ID（按 event_type 解释）" }
  ]; // 关联业务对象ID

  // 一次派发意图的标识：调用方不传则服务端生成 UUID。唯一性按 (request_id, channel) 组合，
  // 见 §3.3 与 GORM schema 注释（今天没有调用方自传，它是"同一次意图不许两行"的提前落地）。
  optional string request_id = 11 [
    json_name = "requestId",
    (gnostic.openapi.v3.property) = { description: "派发请求ID（幂等锚）" }
  ]; // 派发请求ID

  // 已尝试投递次数（含首次）。同步投递恒为 1；异步投递每次尝试先加再一次拨号，
  // 因此 attempts>0 而 status 仍为 SENDING = 拨过号但没回写结论。
  optional uint32 attempts = 12 [
    json_name = "attempts",
    (gnostic.openapi.v3.property) = { description: "实际尝试投递次数（含首次）" }
  ]; // 实际尝试次数

  optional uint32 created_by = 100 [json_name = "createdBy"];
  optional uint32 updated_by = 101 [json_name = "updatedBy"];

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt"];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt"];
}

// 查询投递台账列表 - 回应
message ListNotificationDeliveryResponse {
  repeated NotificationDelivery items = 1;
  uint64 total = 2;
}

// 查询投递台账详情 - 请求
message GetNotificationDeliveryRequest {
  uint32 id = 1;
}
