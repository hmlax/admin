syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/script_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 脚本管理服务（平台管理员）
service ScriptService {
  // 分页查询脚本列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListScriptsResponse) {
    option (api.get) = "/admin/v1/scripts";
  }

  // 统计脚本数量
  rpc Count(admin.v1.PagingRequest) returns (admin.v1.CountScriptsResponse) {
    option (api.get) = "/admin/v1/scripts/count";
  }

  // 查询脚本详情
  rpc Get(admin.v1.GetScriptRequest) returns (admin.v1.Script) {
    option (api.get) = "/admin/v1/scripts/:id";
  }

  // 查询脚本详情
  rpc GetByName(admin.v1.GetScriptRequest) returns (admin.v1.Script) {
    option (api.get) = "/admin/v1/scripts/name/:name";
    option (admin.http.rpc) = "Get";
  }

  // 创建脚本
  rpc Create(admin.v1.CreateScriptRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/scripts";
    option (admin.http.body) = "*";
  }

  // 更新脚本
  rpc Update(admin.v1.UpdateScriptRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/scripts/:id";
    option (admin.http.body) = "*";
  }

  // 删除脚本
  rpc Delete(admin.v1.DeleteScriptRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/scripts";
  }

  // 试运行脚本
  rpc TestRun(admin.v1.TestRunScriptRequest) returns (admin.v1.TestRunScriptResponse) {
    option (api.post) = "/admin/v1/scripts/test_run";
    option (admin.http.body) = "*";
  }

  // 列出全部已注册的钩子点
  rpc ListHookPoints(google.protobuf.Empty) returns (admin.v1.ListHookPointsResponse) {
    option (api.get) = "/admin/v1/script/hooks";
  }
}
