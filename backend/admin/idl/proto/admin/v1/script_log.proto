syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "admin/v1/script_log_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 脚本执行日志管理服务（平台管理员）
service ScriptLogService {
  // 分页查询脚本执行日志
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListScriptLogsResponse) {
    option (api.get) = "/admin/v1/script/logs";
  }

  // 统计脚本执行日志数量
  rpc Count(admin.v1.PagingRequest) returns (admin.v1.CountScriptLogsResponse) {
    option (api.get) = "/admin/v1/script/logs/count";
  }

  // 清理指定时间之前的日志
  rpc Purge(admin.v1.PurgeScriptLogsRequest) returns (admin.v1.PurgeScriptLogsResponse) {
    option (api.post) = "/admin/v1/script/logs/purge";
    option (admin.http.body) = "*";
  }
}
