syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "gnostic/openapi/v3/annotations.proto";
import "admin/v1/events_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// Event stream served as text/event-stream. Every output message is one SSE
// frame. Authentication and stream ownership are checked before the first frame.
service EventService {
  rpc Subscribe(admin.v1.EventSubscriptionRequest) returns (stream admin.v1.EventFrame) {
    option (api.get) = "/events";
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              description: "SSE frames encoded from EventFrame; served on the SSE listener."
              content: {
                additional_properties: {
                  name: "text/event-stream"
                  value: {
                    schema: {
                      schema: {type: "string"}
                    }
                  }
                }
              }
            }
          }
        }
      }
    };
  }
}
