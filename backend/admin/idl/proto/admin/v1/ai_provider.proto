syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/ai_provider_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// AI 模型提供商管理服务
service AiProviderService {
  // 分页查询 AI 提供商列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListAiProviderResponse) {
    option (api.get) = "/admin/v1/ai/providers";
  }

  // 查询 AI 提供商详情
  rpc Get(admin.v1.GetAiProviderRequest) returns (admin.v1.AiProvider) {
    option (api.get) = "/admin/v1/ai/providers/:id";
  }

  // 创建 AI 提供商
  rpc Create(admin.v1.CreateAiProviderRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/ai/providers";
    option (admin.http.body) = "*";
  }

  // 更新 AI 提供商
  rpc Update(admin.v1.UpdateAiProviderRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/ai/providers/:id";
    option (admin.http.body) = "*";
  }

  // 删除 AI 提供商
  rpc Delete(admin.v1.DeleteAiProviderRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/ai/providers/:id";
  }
}
