syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/notification_template_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 通知模板管理服务（平台管理员；租户由 notification_platform_guard 拒绝）
service NotificationTemplateService {
  // 模板列表（分页，contains 搜索）
  rpc ListNotificationTemplate(admin.v1.PagingRequest) returns (admin.v1.ListNotificationTemplateResponse) {
    option (api.get) = "/admin/v1/notification-templates";
  }

  // 模板详情
  rpc GetNotificationTemplate(admin.v1.GetNotificationTemplateRequest) returns (admin.v1.NotificationTemplate) {
    option (api.get) = "/admin/v1/notification-templates/:id";
  }

  // 新建模板
  rpc CreateNotificationTemplate(admin.v1.CreateNotificationTemplateRequest) returns (admin.v1.NotificationTemplate) {
    option (api.post) = "/admin/v1/notification-templates";
    option (admin.http.body) = "*";
  }

  // 更新模板（CRUD 请求体必须包 {data:{...}}，见仓铁律）
  rpc UpdateNotificationTemplate(admin.v1.UpdateNotificationTemplateRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/notification-templates/:id";
    option (admin.http.body) = "*";
  }

  // 删除模板
  rpc DeleteNotificationTemplate(admin.v1.DeleteNotificationTemplateRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/notification-templates/:id";
  }

  // 试渲染：按变量集渲染指定模板，返回标题与正文（管理页预览用，不产生投递）
  rpc RenderNotificationTemplate(admin.v1.RenderNotificationTemplateRequest) returns (admin.v1.RenderNotificationTemplateResponse) {
    option (api.post) = "/admin/v1/notification-templates/:id/render";
    option (admin.http.body) = "*";
  }
}
