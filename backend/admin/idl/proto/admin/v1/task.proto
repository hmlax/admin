syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/task_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 调度任务管理服务
service TaskService {
  // 查询调度任务列表
  rpc List(admin.v1.PagingRequest) returns (admin.v1.ListTaskResponse) {
    option (api.get) = "/admin/v1/tasks";
  }

  // 查询调度任务详情
  rpc Get(admin.v1.GetTaskRequest) returns (admin.v1.Task) {
    option (api.get) = "/admin/v1/tasks/:id";
  }

  // 查询调度任务详情
  rpc GetByTypeName(admin.v1.GetTaskRequest) returns (admin.v1.Task) {
    option (api.get) = "/admin/v1/tasks/type-name/:type_name";
    option (admin.http.rpc) = "Get";
  }

  // 创建调度任务
  rpc Create(admin.v1.CreateTaskRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/tasks";
    option (admin.http.body) = "*";
  }

  // 更新调度任务
  rpc Update(admin.v1.UpdateTaskRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/tasks/:id";
    option (admin.http.body) = "*";
  }

  // 删除调度任务
  rpc Delete(admin.v1.DeleteTaskRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/tasks/:id";
  }

  // 任务类型名称列表
  rpc ListTaskTypeName(google.protobuf.Empty) returns (admin.v1.ListTaskTypeNameResponse) {
    option (api.get) = "/admin/v1/tasks:type-names";
  }

  // 重启所有的调度任务
  rpc RestartAllTask(google.protobuf.Empty) returns (admin.v1.RestartAllTaskResponse) {
    option (api.post) = "/admin/v1/tasks:restart";
    option (admin.http.body) = "*";
  }

  // 启动所有的调度任务
  rpc StartAllTask(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/tasks:start";
    option (admin.http.body) = "*";
  }

  // 停止所有的调度任务
  rpc StopAllTask(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/tasks:stop";
    option (admin.http.body) = "*";
  }

  // 控制调度任务
  rpc ControlTask(admin.v1.ControlTaskRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/tasks:control";
    option (admin.http.body) = "*";
  }
}
