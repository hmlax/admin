syntax = "proto3";

package admin.v1;

import "admin/http.proto";
import "hertz/api.proto";
import "google/protobuf/empty.proto";
import "admin/v1/internal_message_types.proto";
import "admin/v1/pagination_types.proto";

option go_package = "go-admin/admin/biz/model/admin/v1;adminpb";

// 站内信消息管理服务
service InternalMessageService {
  // 查询站内信消息列表
  rpc ListMessage(admin.v1.PagingRequest) returns (admin.v1.ListInternalMessageResponse) {
    option (api.get) = "/admin/v1/internal-message/messages";
  }

  // 查询站内信消息详情
  rpc GetMessage(admin.v1.GetInternalMessageRequest) returns (admin.v1.InternalMessage) {
    option (api.get) = "/admin/v1/internal-message/messages/:id";
  }

  // 更新站内信消息
  rpc UpdateMessage(admin.v1.UpdateInternalMessageRequest) returns (google.protobuf.Empty) {
    option (api.put) = "/admin/v1/internal-message/messages/:id";
    option (admin.http.body) = "*";
  }

  // 删除站内信消息
  rpc DeleteMessage(admin.v1.DeleteInternalMessageRequest) returns (google.protobuf.Empty) {
    option (api.delete) = "/admin/v1/internal-message/messages/:id";
  }

  // 发送消息
  rpc SendMessage(admin.v1.SendMessageRequest) returns (admin.v1.SendMessageResponse) {
    option (api.post) = "/admin/v1/internal-message/send";
    option (admin.http.body) = "*";
  }

  // 撤销某条消息
  rpc RevokeMessage(admin.v1.RevokeMessageRequest) returns (google.protobuf.Empty) {
    option (api.post) = "/admin/v1/internal-message/revoke";
    option (admin.http.body) = "*";
  }
}
