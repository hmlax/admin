layouts:
  - path: handler.go
    disable: true
  - path: router.go
    disable: true
  - path: middleware.go
    disable: true
  - path: register.go
    disable: true
  - path: biz/router/{{.ServiceName}}_generated.go
    loop_service: true
    update_behavior:
      type: cover
    body: |-
      // Code generated by hz update from admin/idl/proto with admin/hz.yaml. DO NOT EDIT.
      package router

      import (
        "go-admin/admin/biz/handler"
        "go-admin/admin/internal/transport"
        apiV1 "go-admin/admin/biz/model/admin/v1"
      )

      func Register{{.Name}}HertzServer(router *transport.Router, service apiV1.{{.Name}}HTTPServer) {
      {{- $service := .Name }}
      {{- range .Methods }}
        router.RegisterHZ({{printf "%q" .HTTPMethod}}, {{printf "%q" .Path}}, handler.Bind{{$service}}{{.Name}}(service))
      {{- end }}
      }
