services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
    ports: ['127.0.0.1:18849:8848', '127.0.0.1:19849:9848']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8848/nacos/v1/console/health/readiness']
      interval: 2s
      timeout: 3s
      retries: 60
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smoke-postgres
      POSTGRES_DB: gwa
    ports: ['127.0.0.1::5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.2-alpine
    ports: ['127.0.0.1::6379']
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    environment:
      MINIO_ROOT_USER: smoke-user
      MINIO_ROOT_PASSWORD: smoke-object-password
    command: server /data
    ports: ['127.0.0.1::9000']
