syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// AI 对话会话
message SysAiConversations {
  option (operator.v1.model) = {
    entity: "AiConversation"
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID"];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt"];

  // 更新时间
  google.protobuf.Timestamp updated_at = 3 [(tagger.tags) = "gorm:\"column:updated_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:更新时间\" json:\"updated_at,omitempty\"", (operator.v1.go_name) = "UpdatedAt"];

  // 删除时间
  google.protobuf.Timestamp deleted_at = 4 [(tagger.tags) = "gorm:\"column:deleted_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:删除时间\" json:\"deleted_at,omitempty\"", (operator.v1.go_name) = "DeletedAt"];

  // 创建者ID
  optional uint32 created_by = 5 [(tagger.tags) = "gorm:\"column:created_by;type:bigint;comment:创建者ID\" json:\"created_by,omitempty\"", (operator.v1.go_name) = "CreatedBy"];

  // 更新者ID
  optional uint32 updated_by = 6 [(tagger.tags) = "gorm:\"column:updated_by;type:bigint;comment:更新者ID\" json:\"updated_by,omitempty\"", (operator.v1.go_name) = "UpdatedBy"];

  // 删除者ID
  optional uint32 deleted_by = 7 [(tagger.tags) = "gorm:\"column:deleted_by;type:bigint;comment:删除者ID\" json:\"deleted_by,omitempty\"", (operator.v1.go_name) = "DeletedBy"];

  // 租户ID
  optional uint32 tenant_id = 8 [(tagger.tags) = "gorm:\"column:tenant_id;type:bigint;default:0;index:idx_sys_ai_conversations_tenant_user,priority:1;comment:租户ID\" json:\"tenant_id,omitempty\"", (operator.v1.go_name) = "TenantID"];

  // 会话标题
  optional string title = 9 [(tagger.tags) = "gorm:\"column:title;type:varchar(255);comment:会话标题\" json:\"title,omitempty\"", (operator.v1.go_name) = "Title"];

  // 会话使用的提供商ID（0=未指定）
  optional uint32 provider_id = 10 [(tagger.tags) = "gorm:\"column:provider_id;type:bigint;comment:会话使用的提供商ID（0=未指定）\" json:\"provider_id,omitempty\"", (operator.v1.go_name) = "ProviderID"];

  // 归属用户ID
  optional uint32 user_id = 11 [(tagger.tags) = "gorm:\"column:user_id;type:bigint;index:idx_sys_ai_conversations_tenant_user,priority:2;comment:归属用户ID\" json:\"user_id,omitempty\"", (operator.v1.go_name) = "UserID"];

  // 最近一条消息时间
  google.protobuf.Timestamp last_message_at = 12 [(tagger.tags) = "gorm:\"column:last_message_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;index:idx_sys_ai_conversations_last_message_at,priority:1;comment:最近一条消息时间\" json:\"last_message_at,omitempty\"", (operator.v1.go_name) = "LastMessageAt"];
}
