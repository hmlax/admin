syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// 平台脚本表（脚本引擎插件承载）
message SysScripts {
  option (operator.v1.model) = {
    entity: "Script"
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID", (operator.v1.immutable) = true];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;index:idx_sys_scripts_created_at,priority:1;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt", (operator.v1.immutable) = true];

  // 更新时间
  google.protobuf.Timestamp updated_at = 3 [(tagger.tags) = "gorm:\"column:updated_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:更新时间\" json:\"updated_at,omitempty\"", (operator.v1.go_name) = "UpdatedAt"];

  // 删除时间
  google.protobuf.Timestamp deleted_at = 4 [(tagger.tags) = "gorm:\"column:deleted_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:删除时间\" json:\"deleted_at,omitempty\"", (operator.v1.go_name) = "DeletedAt"];

  // 创建者ID
  optional uint32 created_by = 5 [(tagger.tags) = "gorm:\"column:created_by;type:bigint;comment:创建者ID\" json:\"created_by,omitempty\"", (operator.v1.go_name) = "CreatedBy"];

  // 更新者ID
  optional uint32 updated_by = 6 [(tagger.tags) = "gorm:\"column:updated_by;type:bigint;comment:更新者ID\" json:\"updated_by,omitempty\"", (operator.v1.go_name) = "UpdatedBy"];

  // 删除者ID
  optional uint32 deleted_by = 7 [(tagger.tags) = "gorm:\"column:deleted_by;type:bigint;comment:删除者ID\" json:\"deleted_by,omitempty\"", (operator.v1.go_name) = "DeletedBy"];

  // 是否启用
  optional bool is_enabled = 8 [(tagger.tags) = "gorm:\"column:is_enabled;type:boolean;default:true;index:idx_sys_scripts_hook_point_enabled,priority:2;comment:是否启用\" json:\"is_enabled,omitempty\"", (operator.v1.go_name) = "IsEnabled"];

  // 脚本唯一名称
  optional string name = 9 [(tagger.tags) = "gorm:\"column:name;type:varchar(255);uniqueIndex:uk_sys_scripts_name,priority:1;comment:脚本唯一名称\" json:\"name,omitempty\"", (operator.v1.go_name) = "Name"];

  // 脚本语言（LUA=Lua JAVASCRIPT=JavaScript）
  optional string language = 10 [(tagger.tags) = "gorm:\"column:language;type:varchar(255);default:LUA;comment:脚本语言（LUA=Lua JAVASCRIPT=JavaScript）\" json:\"language,omitempty\"", (operator.v1.go_name) = "Language", (operator.v1.enum_values) = { name: "LanguageLUA" value: "LUA" }, (operator.v1.enum_values) = { name: "LanguageJAVASCRIPT" value: "JAVASCRIPT" }];

  // 挂载的钩子点名称，空表示未挂载
  optional string hook_point = 11 [(tagger.tags) = "gorm:\"column:hook_point;type:varchar(255);index:idx_sys_scripts_hook_point_enabled,priority:1;comment:挂载的钩子点名称，空表示未挂载\" json:\"hook_point,omitempty\"", (operator.v1.go_name) = "HookPoint"];

  // 脚本源码
  optional string source = 12 [(tagger.tags) = "gorm:\"column:source;type:text;comment:脚本源码\" json:\"source,omitempty\"", (operator.v1.go_name) = "Source"];

  // 执行优先级，越小越先执行
  optional int32 priority = 13 [(tagger.tags) = "gorm:\"column:priority;type:integer;default:0;comment:执行优先级，越小越先执行\" json:\"priority,omitempty\"", (operator.v1.go_name) = "Priority"];

  // 脚本用途说明
  optional string description = 14 [(tagger.tags) = "gorm:\"column:description;type:varchar(255);comment:脚本用途说明\" json:\"description,omitempty\"", (operator.v1.go_name) = "Description"];

  // 关键脚本：执行失败时中断钩子链
  optional bool critical = 15 [(tagger.tags) = "gorm:\"column:critical;type:boolean;default:false;comment:关键脚本：执行失败时中断钩子链\" json:\"critical,omitempty\"", (operator.v1.go_name) = "Critical"];

  // 版本号，每次更新自增（热更新指纹）
  optional uint32 version = 16 [(tagger.tags) = "gorm:\"column:version;type:bigint;default:1;comment:版本号，每次更新自增（热更新指纹）\" json:\"version,omitempty\"", (operator.v1.go_name) = "Version"];
}
