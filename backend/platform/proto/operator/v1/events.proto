syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";


// Event stream served as text/event-stream. Every output message is one SSE
// frame. Authentication and stream ownership are checked before the first frame.
service EventService {
  rpc Subscribe(EventSubscriptionRequest) returns (stream EventFrame) {
  }
}
message EventSubscriptionRequest {
  string stream = 1;
  // Optional EventSource credential; Authorization: Bearer is preferred.
  string token = 2;
}
message EventFrame {
  bytes id = 1;
  // Polymorphic SSE wire data, not an RPC business DTO wrapper.
  bytes data = 2;
  bytes event = 3;
  bytes retry = 4;
  bytes comment = 5;
}
