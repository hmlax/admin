syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// AI Agent 运行记录
message SysAiAgentRuns {
  option (operator.v1.model) = {
    entity: "AiAgentRun"
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID"];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt"];

  // 更新时间
  google.protobuf.Timestamp updated_at = 3 [(tagger.tags) = "gorm:\"column:updated_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:更新时间\" json:\"updated_at,omitempty\"", (operator.v1.go_name) = "UpdatedAt"];

  // 删除时间
  google.protobuf.Timestamp deleted_at = 4 [(tagger.tags) = "gorm:\"column:deleted_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:删除时间\" json:\"deleted_at,omitempty\"", (operator.v1.go_name) = "DeletedAt"];

  // 创建者ID
  optional uint32 created_by = 5 [(tagger.tags) = "gorm:\"column:created_by;type:bigint;comment:创建者ID\" json:\"created_by,omitempty\"", (operator.v1.go_name) = "CreatedBy"];

  // 更新者ID
  optional uint32 updated_by = 6 [(tagger.tags) = "gorm:\"column:updated_by;type:bigint;comment:更新者ID\" json:\"updated_by,omitempty\"", (operator.v1.go_name) = "UpdatedBy"];

  // 删除者ID
  optional uint32 deleted_by = 7 [(tagger.tags) = "gorm:\"column:deleted_by;type:bigint;comment:删除者ID\" json:\"deleted_by,omitempty\"", (operator.v1.go_name) = "DeletedBy"];

  // 租户ID
  optional uint32 tenant_id = 8 [(tagger.tags) = "gorm:\"column:tenant_id;type:bigint;default:0;index:idx_sys_ai_agent_runs_tenant_app,priority:1;comment:租户ID\" json:\"tenant_id,omitempty\"", (operator.v1.go_name) = "TenantID"];

  // 应用ID
  optional uint32 app_id = 9 [(tagger.tags) = "gorm:\"column:app_id;type:bigint;index:idx_sys_ai_agent_runs_tenant_app,priority:2;comment:应用ID\" json:\"app_id,omitempty\"", (operator.v1.go_name) = "AppID"];

  // 运行状态
  string status = 10 [(tagger.tags) = "gorm:\"column:status;type:varchar(255);not null;default:RUNNING;comment:运行状态\" json:\"status,omitempty\"", (operator.v1.go_name) = "Status", (operator.v1.enum_values) = { name: "StatusRunning" value: "RUNNING" }, (operator.v1.enum_values) = { name: "StatusSucceeded" value: "SUCCEEDED" }, (operator.v1.enum_values) = { name: "StatusFailed" value: "FAILED" }];

  // 运行入参 JSON（start 节点声明的变量）
  optional string input = 11 [(tagger.tags) = "gorm:\"column:input;type:text;comment:运行入参 JSON（start 节点声明的变量）\" json:\"input,omitempty\"", (operator.v1.go_name) = "Input"];

  // 产出（到达的 end 节点渲染值）
  optional string output = 12 [(tagger.tags) = "gorm:\"column:output;type:text;comment:产出（到达的 end 节点渲染值）\" json:\"output,omitempty\"", (operator.v1.go_name) = "Output"];

  // 失败原因
  optional string error = 13 [(tagger.tags) = "gorm:\"column:error;type:text;comment:失败原因\" json:\"error,omitempty\"", (operator.v1.go_name) = "Error"];

  // 逐节点执行轨迹 JSON
  string trace = 14 [(tagger.tags) = "gorm:\"column:trace;type:text;not null;comment:逐节点执行轨迹 JSON\" json:\"trace,omitempty\"", (operator.v1.go_name) = "Trace"];

  // 输入 token 合计
  uint32 prompt_tokens = 15 [(tagger.tags) = "gorm:\"column:prompt_tokens;type:bigint;not null;default:0;comment:输入 token 合计\" json:\"prompt_tokens,omitempty\"", (operator.v1.go_name) = "PromptTokens"];

  // 输出 token 合计
  uint32 completion_tokens = 16 [(tagger.tags) = "gorm:\"column:completion_tokens;type:bigint;not null;default:0;comment:输出 token 合计\" json:\"completion_tokens,omitempty\"", (operator.v1.go_name) = "CompletionTokens"];

  // 总 token 合计
  uint32 total_tokens = 17 [(tagger.tags) = "gorm:\"column:total_tokens;type:bigint;not null;default:0;comment:总 token 合计\" json:\"total_tokens,omitempty\"", (operator.v1.go_name) = "TotalTokens"];

  // 总耗时（毫秒）
  uint32 duration_ms = 18 [(tagger.tags) = "gorm:\"column:duration_ms;type:bigint;not null;default:0;comment:总耗时（毫秒）\" json:\"duration_ms,omitempty\"", (operator.v1.go_name) = "DurationMs"];
}
