syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// 单据打印模板表（设计器 TemplateData JSON；租户隔离，内置模板禁删可复制）
message PrintTemplates {
  option (operator.v1.model) = {
    entity: "PrintTemplate"
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID", (operator.v1.immutable) = true];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;index:idx_print_templates_created_at,priority:1;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt", (operator.v1.immutable) = true];

  // 更新时间
  google.protobuf.Timestamp updated_at = 3 [(tagger.tags) = "gorm:\"column:updated_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:更新时间\" json:\"updated_at,omitempty\"", (operator.v1.go_name) = "UpdatedAt"];

  // 删除时间
  google.protobuf.Timestamp deleted_at = 4 [(tagger.tags) = "gorm:\"column:deleted_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:删除时间\" json:\"deleted_at,omitempty\"", (operator.v1.go_name) = "DeletedAt"];

  // 创建者ID
  optional uint32 created_by = 5 [(tagger.tags) = "gorm:\"column:created_by;type:bigint;comment:创建者ID\" json:\"created_by,omitempty\"", (operator.v1.go_name) = "CreatedBy"];

  // 更新者ID
  optional uint32 updated_by = 6 [(tagger.tags) = "gorm:\"column:updated_by;type:bigint;comment:更新者ID\" json:\"updated_by,omitempty\"", (operator.v1.go_name) = "UpdatedBy"];

  // 删除者ID
  optional uint32 deleted_by = 7 [(tagger.tags) = "gorm:\"column:deleted_by;type:bigint;comment:删除者ID\" json:\"deleted_by,omitempty\"", (operator.v1.go_name) = "DeletedBy"];

  // 是否启用
  optional bool is_enabled = 8 [(tagger.tags) = "gorm:\"column:is_enabled;type:boolean;default:true;comment:是否启用\" json:\"is_enabled,omitempty\"", (operator.v1.go_name) = "IsEnabled"];

  // 排序值（越小越靠前）
  optional uint32 sort_order = 9 [(tagger.tags) = "gorm:\"column:sort_order;type:bigint;default:0;comment:排序值（越小越靠前）\" json:\"sort_order,omitempty\"", (operator.v1.go_name) = "SortOrder"];

  // 租户ID
  optional uint32 tenant_id = 10 [(tagger.tags) = "gorm:\"column:tenant_id;type:bigint;default:0;uniqueIndex:uidx_print_templates_code_tenant,priority:2;comment:租户ID\" json:\"tenant_id,omitempty\"", (operator.v1.go_name) = "TenantID", (operator.v1.immutable) = true];

  // 模板名称（展示用）
  optional string name = 11 [(tagger.tags) = "gorm:\"column:name;type:varchar(255);comment:模板名称（展示用）\" json:\"name,omitempty\"", (operator.v1.go_name) = "Name"];

  // 模板编码，租户内唯一，业务侧按编码取模板
  optional string code = 12 [(tagger.tags) = "gorm:\"column:code;type:varchar(255);uniqueIndex:uidx_print_templates_code_tenant,priority:1;comment:模板编码，租户内唯一，业务侧按编码取模板\" json:\"code,omitempty\"", (operator.v1.go_name) = "Code"];

  // 绑定资源标识（对应菜单/资源的 generated service 键，字段面板据其拉字段 schema）
  optional string resource_key = 13 [(tagger.tags) = "gorm:\"column:resource_key;type:varchar(255);index:idx_print_templates_resource_key,priority:1;comment:绑定资源标识（对应菜单/资源的 generated service 键，字段面板据其拉字段 schema）\" json:\"resource_key,omitempty\"", (operator.v1.go_name) = "ResourceKey"];

  // 模板 JSON（go-wind-print TemplateData：毫米布局 + schemaVersion，服务端不解析只透传）
  optional string payload = 14 [(tagger.tags) = "gorm:\"column:payload;type:text;comment:模板 JSON（go-wind-print TemplateData：毫米布局 + schemaVersion，服务端不解析只透传）\" json:\"payload,omitempty\"", (operator.v1.go_name) = "Payload"];

  // 是否系统内置模板（内置禁删，可复制派生）
  optional bool is_built_in = 15 [(tagger.tags) = "gorm:\"column:is_built_in;type:boolean;default:false;comment:是否系统内置模板（内置禁删，可复制派生）\" json:\"is_built_in,omitempty\"", (operator.v1.go_name) = "IsBuiltIn"];

  // 纸张尺寸冗余列（A4/A5/80mm 等，来自 payload.paperSize，列表页直显免解析 JSON）
  optional string paper_size = 16 [(tagger.tags) = "gorm:\"column:paper_size;type:varchar(255);comment:纸张尺寸冗余列（A4/A5/80mm 等，来自 payload.paperSize，列表页直显免解析 JSON）\" json:\"paper_size,omitempty\"", (operator.v1.go_name) = "PaperSize"];

  // 纸张方向冗余列（portrait/landscape，来自 payload.orientation）
  optional string orientation = 17 [(tagger.tags) = "gorm:\"column:orientation;type:varchar(255);comment:纸张方向冗余列（portrait/landscape，来自 payload.orientation）\" json:\"orientation,omitempty\"", (operator.v1.go_name) = "Orientation"];
}
