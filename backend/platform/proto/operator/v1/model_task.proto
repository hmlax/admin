  optional uint32 tenant_id = 9 [(tagger.tags) = "gorm:\"column:tenant_id;type:bigint;default:0;uniqueIndex:idx_sys_task_tenant_type_name,priority:1;index:idx_sys_task_tenant_type,priority:1;index:idx_sys_task_tenant_enable_created_at,priority:1;index:idx_sys_task_tenant_created_by_created_at,priority:1;index:idx_sys_task_tenant_created_at,priority:1;comment:租户ID\" json:\"tenant_id,omitempty\"", (operator.v1.go_name) = "TenantID", (operator.v1.immutable) = true];

