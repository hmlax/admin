syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// 套餐目录表
message SysPlans {
  option (operator.v1.model) = {
    entity: "Plan"
    relations: { name: "Modules" target: "SysPlanModules" foreign_key: "PlanID" references: "ID" many: true }
    relations: { name: "Quotas" target: "SysPlanQuotas" foreign_key: "PlanID" references: "ID" many: true }
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID", (operator.v1.immutable) = true];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;index:idx_sys_plans_created_at,priority:1;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt", (operator.v1.immutable) = true];

  // 更新时间
  google.protobuf.Timestamp updated_at = 3 [(tagger.tags) = "gorm:\"column:updated_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:更新时间\" json:\"updated_at,omitempty\"", (operator.v1.go_name) = "UpdatedAt"];

  // 删除时间
  google.protobuf.Timestamp deleted_at = 4 [(tagger.tags) = "gorm:\"column:deleted_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:删除时间\" json:\"deleted_at,omitempty\"", (operator.v1.go_name) = "DeletedAt"];

  // 创建者ID
  optional uint32 created_by = 5 [(tagger.tags) = "gorm:\"column:created_by;type:bigint;comment:创建者ID\" json:\"created_by,omitempty\"", (operator.v1.go_name) = "CreatedBy"];

  // 更新者ID
  optional uint32 updated_by = 6 [(tagger.tags) = "gorm:\"column:updated_by;type:bigint;comment:更新者ID\" json:\"updated_by,omitempty\"", (operator.v1.go_name) = "UpdatedBy"];

  // 删除者ID
  optional uint32 deleted_by = 7 [(tagger.tags) = "gorm:\"column:deleted_by;type:bigint;comment:删除者ID\" json:\"deleted_by,omitempty\"", (operator.v1.go_name) = "DeletedBy"];

  // 备注
  optional string remark = 8 [(tagger.tags) = "gorm:\"column:remark;type:varchar(255);comment:备注\" json:\"remark,omitempty\"", (operator.v1.go_name) = "Remark"];

  // 套餐名称
  optional string name = 9 [(tagger.tags) = "gorm:\"column:name;type:varchar(255);uniqueIndex:uix_sys_plans_name,priority:1;comment:套餐名称\" json:\"name,omitempty\"", (operator.v1.go_name) = "Name", (operator.v1.min_len) = 1];

  // 套餐版本
  optional string version = 10 [(tagger.tags) = "gorm:\"column:version;type:varchar(255);default:FREE;comment:套餐版本\" json:\"version,omitempty\"", (operator.v1.go_name) = "Version", (operator.v1.enum_values) = { name: "VersionFree" value: "FREE" }, (operator.v1.enum_values) = { name: "VersionStandard" value: "STANDARD" }, (operator.v1.enum_values) = { name: "VersionEnterprise" value: "ENTERPRISE" }];

  // 到期处置策略
  optional string expiry_policy = 11 [(tagger.tags) = "gorm:\"column:expiry_policy;type:varchar(255);default:READONLY;comment:到期处置策略\" json:\"expiry_policy,omitempty\"", (operator.v1.go_name) = "ExpiryPolicy", (operator.v1.enum_values) = { name: "ExpiryPolicyReadonly" value: "READONLY" }, (operator.v1.enum_values) = { name: "ExpiryPolicyBlockLogin" value: "BLOCK_LOGIN" }, (operator.v1.enum_values) = { name: "ExpiryPolicyFreeze" value: "FREEZE" }];

  // 数据保留周期（天）
  optional uint32 data_retention_days = 12 [(tagger.tags) = "gorm:\"column:data_retention_days;type:bigint;comment:数据保留周期（天）\" json:\"data_retention_days,omitempty\"", (operator.v1.go_name) = "DataRetentionDays"];

  // 描述
  optional string description = 13 [(tagger.tags) = "gorm:\"column:description;type:varchar(255);comment:描述\" json:\"description,omitempty\"", (operator.v1.go_name) = "Description"];
}
