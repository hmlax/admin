syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "operator/v1/authentication.proto";

// MFA（多因素认证）服务 HTTP 桥接。
// 管理侧 RPC（GetMFAStatus/ListEnrolledMethods/StartEnrollMethod/ConfirmEnrollMethod/
// DisableMFA/RevokeMFADevice）需登录态，走正常 auth+authz 中间件，不加 security:{}。
// 登录挑战侧 RPC（VerifyMFAChallenge）免鉴权，加 security:{} 并加入 rest_server 白名单。
service MfaService {
  // 查询当前登录用户 MFA 总览
  rpc GetMFAStatus (operator.v1.GetMFAStatusRequest) returns (operator.v1.GetMFAStatusResponse) {
  }

  // 列出已注册的 MFA 凭证
  rpc ListEnrolledMethods (operator.v1.ListEnrolledMethodsRequest) returns (operator.v1.ListEnrolledMethodsResponse) {
  }

  // 开始注册 MFA 方法（返回 secret/QR，仅 TOTP 本轮实现）
  rpc StartEnrollMethod (operator.v1.StartEnrollMethodRequest) returns (operator.v1.StartEnrollMethodResponse) {
  }

  // 确认注册 MFA 方法（提交首码完成绑定）
  rpc ConfirmEnrollMethod (operator.v1.ConfirmEnrollMethodRequest) returns (operator.v1.ConfirmEnrollMethodResponse) {
  }

  // 禁用/移除已注册 MFA 凭证。
  // 注意：kratos http 生成器不支持 DELETE 请求体（handler 只 BindQuery），
  // 而 TS 生成器默认把 message 序列化为 body——为两端一致改用 POST + body。
  rpc DisableMFA (operator.v1.DisableMFARequest) returns (google.protobuf.Empty) {
  }

  // 撤销指定 MFA 凭证（按 id）。
  // ⚠️ 当前无前端调用方：DELETE 请求体在 Go 生成器（恒 BindQuery）与 TS 生成器
  // （发 body）之间不一致，贸然对接会静默丢参——需要时应改 POST（参见 DisableMFA）。
  rpc RevokeMFADevice (operator.v1.RevokeMFADeviceRequest) returns (google.protobuf.Empty) {
  }

  // 验证登录 MFA 挑战。通过则返回 LoginResponse（含真 access_token）。
  // 免鉴权：登录流程在密码校验通过、待二次验证阶段调用。
  rpc VerifyMFAChallenge (operator.v1.VerifyMFAChallengeRequest) returns (operator.v1.LoginResponse) {
  }
}

// 多因素认证（MFA）服务：分步注册、挑战/验证、管理已注册凭证与备份码


// 多因素认证方法
message MFAMethod {
enum MFAMethod {
  MFA_METHOD_UNSPECIFIED = 0;
  TOTP = 1;
  SMS = 2;
  EMAIL = 3;
  U2F = 4;
  WEBAUTHN = 5;
  BACKUP_CODE = 6;

  OTHER = 100;
}
}

// 请求/响应与数据结构

message GetMFAStatusRequest {
  // 可选：若服务端通过上下文识别用户，可不传 user_id
  optional string user_id = 1;
}

message GetMFAStatusResponse {
  bool enabled = 1;
  repeated EnrolledMethod enrolled = 2;
  MFAEnforcement.MFAEnforcement enforcement = 3;
}

message MFAEnforcement {
enum MFAEnforcement {
  MFA_NOT_REQUIRED = 0;
  MFA_OPTIONAL = 1;
  MFA_REQUIRED = 2;
}
}

message EnrolledMethod {
  string id = 1;                // 凭证 id（内部唯一标识）
  MFAMethod.MFAMethod method = 2;
  string display = 3;           // 展示用（如掩码手机号、设备名）
  bool enabled = 4;
  optional google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp last_used_at = 6;
}

// 列表已注册凭证
message ListEnrolledMethodsRequest {
  optional string user_id = 1;
}
message ListEnrolledMethodsResponse {
  repeated EnrolledMethod items = 1;
}

// Start enroll
message StartEnrollMethodRequest {
  MFAMethod.MFAMethod method = 1;
  // 根据 method 可能需要额外参数（例如 SMS 需要 phone）
  optional string phone = 2;
  optional string email = 3;
}
message StartEnrollMethodResponse {
  // 不同方法的启动结果
  oneof result {
    TOTPResult totp = 1;
    SMSResult sms = 2;
    WebAuthnResult webauthn = 3;
  }
  optional google.protobuf.Timestamp expires_at = 10;
  // 临时操作 id，用于 ConfirmEnrollMethod / 后续验证
  string operation_id = 11;
}

message TOTPResult {
  // base32 secret：仅在注册时返回一次，服务端应只存哈希/引用
  string secret = 1;
  string otp_auth_url = 2;
  string qr_code_data_uri = 3;
}

message SMSResult {
  string verification_id = 1;
  bool sms_sent = 2;
  string masked_phone = 3;
}

message WebAuthnResult {
  string challenge = 1;
  string options_json = 2;
  string rp_id = 3;
}

// Confirm enroll
message ConfirmEnrollMethodRequest {
  MFAMethod.MFAMethod method = 1;
  string operation_id = 2;
  oneof credential {
    string totp_code = 10;
    SMSVerification sms = 11;
    WebAuthnAssertion webauthn = 12;
    string backup_code = 13;
  }
  // 可选：设备/显示名
  optional string display = 20;
}
message ConfirmEnrollMethodResponse {
  bool success = 1;
  string credential_id = 2; // 新创建的凭证 id
}

// Disable / remove
message DisableMFARequest {
  // 指定凭证 id 或仅按方法禁用全部
  optional string credential_id = 1;
  optional MFAMethod.MFAMethod method = 2;
  // 验证凭证：密码或验证码
  oneof verifier {
    string password = 10;
    string totp_code = 11;
    SMSVerification sms = 12;
    WebAuthnAssertion webauthn = 13;
  }
  optional string reason = 20;
  // 管理端重置：指定目标用户（不传=操作当前登录用户）。
  // 仅平台管理员可指定他人，用于用户认证器丢失时的救援解绑（按 method 清空该用户全部因子）。
  optional uint32 user_id = 21;
}

// Start authentication challenge
message StartMFAChallengeRequest {
  optional string user_id = 1;
  MFAMethod.MFAMethod method = 2;
  optional string credential_id = 3; // 指定凭证（若多设备）
}
message StartMFAChallengeResponse {
  oneof challenge {
    SMSResult sms = 1;
    WebAuthnResult webauthn = 2;
    // TOTP 无需服务端 challenge，前端直接提示输入
  }
  string operation_id = 10;
  optional google.protobuf.Timestamp expires_at = 11;
}

message VerifyMFAChallengeRequest {
  string operation_id = 1;
  oneof response {
    string totp_code = 10;
    SMSVerification sms = 11;
    WebAuthnAssertion webauthn = 12;
    string backup_code = 13;
  }
}
message VerifyMFAChallengeResponse {
  bool success = 1;
  // 可选：一次性登录令牌或 session id（实现可选）
  optional string session_token = 2;
}

// 备份码管理
message GenerateBackupCodesRequest {
  // 要生成的数量
  optional int32 count = 1 [(gnostic.openapi.v3.property) = { description: "生成备份码数量" }];
}
message GenerateBackupCodesResponse {
  // 明文备份码：仅返回一次，客户端需提示用户保存
  repeated string codes = 1;
  optional google.protobuf.Timestamp generated_at = 2;
}
message ListBackupCodesRequest {}
message ListBackupCodesResponse {
  // 仅返回元信息（剩余可用数量），不返回明文
  int32 remaining = 1;
  optional google.protobuf.Timestamp generated_at = 2;
}

// 撤销设备/凭证
message RevokeMFADeviceRequest {
  string credential_id = 1;
}
message SMSVerification {
  string verification_id = 1;
  string code = 2;
}
message WebAuthnAssertion {
  string id = 1;
  string client_data_json = 2;
  string authenticator_data = 3;
  string signature = 4;
  optional string user_handle = 5;
}
