syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// 脚本执行日志
message SysScriptLogs {
  option (operator.v1.model) = {
    entity: "ScriptLog"
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID", (operator.v1.immutable) = true];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;index:idx_sys_script_logs_script_created,priority:2;index:idx_sys_script_logs_success_created,priority:2;index:idx_sys_script_logs_created_at,priority:1;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt", (operator.v1.immutable) = true];

  // 更新时间
  google.protobuf.Timestamp updated_at = 3 [(tagger.tags) = "gorm:\"column:updated_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:更新时间\" json:\"updated_at,omitempty\"", (operator.v1.go_name) = "UpdatedAt"];

  // 删除时间
  google.protobuf.Timestamp deleted_at = 4 [(tagger.tags) = "gorm:\"column:deleted_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:删除时间\" json:\"deleted_at,omitempty\"", (operator.v1.go_name) = "DeletedAt"];

  // 脚本ID（试运行草稿为 0）
  optional uint32 script_id = 5 [(tagger.tags) = "gorm:\"column:script_id;type:bigint;default:0;index:idx_sys_script_logs_script_created,priority:1;comment:脚本ID（试运行草稿为 0）\" json:\"script_id,omitempty\"", (operator.v1.go_name) = "ScriptID"];

  // 脚本名称
  optional string script_name = 6 [(tagger.tags) = "gorm:\"column:script_name;type:varchar(255);comment:脚本名称\" json:\"script_name,omitempty\"", (operator.v1.go_name) = "ScriptName"];

  // 脚本语言（LUA/JAVASCRIPT）
  optional string language = 7 [(tagger.tags) = "gorm:\"column:language;type:varchar(255);comment:脚本语言（LUA/JAVASCRIPT）\" json:\"language,omitempty\"", (operator.v1.go_name) = "Language"];

  // 触发方式（hook/task/test_run/manual）
  optional string trigger_type = 8 [(tagger.tags) = "gorm:\"column:trigger_type;type:varchar(255);comment:触发方式（hook/task/test_run/manual）\" json:\"trigger_type,omitempty\"", (operator.v1.go_name) = "TriggerType"];

  // 钩子点或任务类型
  optional string hook_point = 9 [(tagger.tags) = "gorm:\"column:hook_point;type:varchar(255);comment:钩子点或任务类型\" json:\"hook_point,omitempty\"", (operator.v1.go_name) = "HookPoint"];

  // 执行时的脚本版本（草稿为 0）
  optional uint32 version = 10 [(tagger.tags) = "gorm:\"column:version;type:bigint;default:0;comment:执行时的脚本版本（草稿为 0）\" json:\"version,omitempty\"", (operator.v1.go_name) = "Version"];

  // 是否执行成功
  optional bool success = 11 [(tagger.tags) = "gorm:\"column:success;type:boolean;default:false;index:idx_sys_script_logs_success_created,priority:1;comment:是否执行成功\" json:\"success,omitempty\"", (operator.v1.go_name) = "Success"];

  // 执行耗时（毫秒）
  optional int64 duration_ms = 12 [(tagger.tags) = "gorm:\"column:duration_ms;type:bigint;default:0;comment:执行耗时（毫秒）\" json:\"duration_ms,omitempty\"", (operator.v1.go_name) = "DurationMs"];

  // 失败原因（成功为空）
  optional string error = 13 [(tagger.tags) = "gorm:\"column:error;type:text;comment:失败原因（成功为空）\" json:\"error,omitempty\"", (operator.v1.go_name) = "Error"];
