syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// 文件表
message Files {
  option (operator.v1.model) = {
    entity: "File"
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID", (operator.v1.immutable) = true];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;index:idx_files_created_at,priority:1;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt", (operator.v1.immutable) = true];

  // 更新时间
  google.protobuf.Timestamp updated_at = 3 [(tagger.tags) = "gorm:\"column:updated_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:更新时间\" json:\"updated_at,omitempty\"", (operator.v1.go_name) = "UpdatedAt"];

  // 删除时间
  google.protobuf.Timestamp deleted_at = 4 [(tagger.tags) = "gorm:\"column:deleted_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:删除时间\" json:\"deleted_at,omitempty\"", (operator.v1.go_name) = "DeletedAt"];

  // 创建者ID
  optional uint32 created_by = 5 [(tagger.tags) = "gorm:\"column:created_by;type:bigint;comment:创建者ID\" json:\"created_by,omitempty\"", (operator.v1.go_name) = "CreatedBy"];

  // 更新者ID
  optional uint32 updated_by = 6 [(tagger.tags) = "gorm:\"column:updated_by;type:bigint;comment:更新者ID\" json:\"updated_by,omitempty\"", (operator.v1.go_name) = "UpdatedBy"];

  // 删除者ID
  optional uint32 deleted_by = 7 [(tagger.tags) = "gorm:\"column:deleted_by;type:bigint;comment:删除者ID\" json:\"deleted_by,omitempty\"", (operator.v1.go_name) = "DeletedBy"];

  // 备注
  optional string remark = 8 [(tagger.tags) = "gorm:\"column:remark;type:varchar(255);comment:备注\" json:\"remark,omitempty\"", (operator.v1.go_name) = "Remark"];

  // 租户ID
  optional uint32 tenant_id = 9 [(tagger.tags) = "gorm:\"column:tenant_id;type:bigint;default:0;index:idx_files_tenant_id,priority:1;uniqueIndex:uix_files_tenant_file_guid,priority:1;index:idx_files_tenant_content_hash,priority:1;comment:租户ID\" json:\"tenant_id,omitempty\"", (operator.v1.go_name) = "TenantID", (operator.v1.immutable) = true];

  // OSS供应商
  optional string provider = 10 [(tagger.tags) = "gorm:\"column:provider;type:varchar(255);default:MINIO;comment:OSS供应商\" json:\"provider,omitempty\"", (operator.v1.go_name) = "Provider", (operator.v1.enum_values) = { name: "ProviderUnknown" value: "UNKNOWN" }, (operator.v1.enum_values) = { name: "ProviderMinIO" value: "MINIO" }, (operator.v1.enum_values) = { name: "ProviderAliyun" value: "ALIYUN" }, (operator.v1.enum_values) = { name: "ProviderQiniu" value: "QINIU" }, (operator.v1.enum_values) = { name: "ProviderTencent" value: "TENCENT" }, (operator.v1.enum_values) = { name: "ProviderAWS" value: "AWS" }, (operator.v1.enum_values) = { name: "ProviderGoogle" value: "GOOGLE" }, (operator.v1.enum_values) = { name: "ProviderAzure" value: "AZURE" }, (operator.v1.enum_values) = { name: "ProviderBaidu" value: "BAIDU" }, (operator.v1.enum_values) = { name: "ProviderHuawei" value: "HUAWEI" }, (operator.v1.enum_values) = { name: "ProviderLocal" value: "LOCAL" }];

  // 存储桶名称
  optional string bucket_name = 11 [(tagger.tags) = "gorm:\"column:bucket_name;type:varchar(255);index:idx_files_bucket_name,priority:1;comment:存储桶名称\" json:\"bucket_name,omitempty\"", (operator.v1.go_name) = "BucketName"];

  // 文件目录
  optional string file_directory = 12 [(tagger.tags) = "gorm:\"column:file_directory;type:varchar(255);comment:文件目录\" json:\"file_directory,omitempty\"", (operator.v1.go_name) = "FileDirectory"];

  // 文件Guid
  optional string file_guid = 13 [(tagger.tags) = "gorm:\"column:file_guid;type:varchar(255);uniqueIndex:uix_files_tenant_file_guid,priority:2;comment:文件Guid\" json:\"file_guid,omitempty\"", (operator.v1.go_name) = "FileGUID"];

  // 实际存储文件名
  optional string save_file_name = 14 [(tagger.tags) = "gorm:\"column:save_file_name;type:varchar(255);comment:实际存储文件名\" json:\"save_file_name,omitempty\"", (operator.v1.go_name) = "SaveFileName"];

  // 原始文件名
  optional string file_name = 15 [(tagger.tags) = "gorm:\"column:file_name;type:varchar(255);index:idx_files_file_name,priority:1;comment:原始文件名\" json:\"file_name,omitempty\"", (operator.v1.go_name) = "FileName"];

  // 文件扩展名
  optional string extension = 16 [(tagger.tags) = "gorm:\"column:extension;type:varchar(255);index:idx_files_extension,priority:1;comment:文件扩展名\" json:\"extension,omitempty\"", (operator.v1.go_name) = "Extension"];

  // 文件长度，单位：字节
  optional uint64 size = 17 [(tagger.tags) = "gorm:\"column:size;type:bigint;index:idx_files_size,priority:1;comment:文件长度，单位：字节\" json:\"size,omitempty\"", (operator.v1.go_name) = "Size"];

  // 格式化后的文件长度字符串
  optional string size_format = 18 [(tagger.tags) = "gorm:\"column:size_format;type:varchar(255);comment:格式化后的文件长度字符串\" json:\"size_format,omitempty\"", (operator.v1.go_name) = "SizeFormat"];

  // 链接地址
  optional string link_url = 19 [(tagger.tags) = "gorm:\"column:link_url;type:varchar(255);comment:链接地址\" json:\"link_url,omitempty\"", (operator.v1.go_name) = "LinkURL"];

  // 文件内容hash值，防止上传重复文件
  optional string content_hash = 20 [(tagger.tags) = "gorm:\"column:content_hash;type:varchar(255);index:idx_files_tenant_content_hash,priority:2;index:idx_files_content_hash,priority:1;comment:文件内容hash值，防止上传重复文件\" json:\"content_hash,omitempty\"", (operator.v1.go_name) = "ContentHash"];
}
