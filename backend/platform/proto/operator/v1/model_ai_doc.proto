syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// AI 知识库文档
message SysAiDocs {
  option (operator.v1.model) = {
    entity: "AiDoc"
    relations: { name: "AiKnowledgeBase" target: "SysAiKnowledgeBases" foreign_key: "BaseID" references: "ID" many: false }
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID"];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt"];

  // 更新时间
  google.protobuf.Timestamp updated_at = 3 [(tagger.tags) = "gorm:\"column:updated_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:更新时间\" json:\"updated_at,omitempty\"", (operator.v1.go_name) = "UpdatedAt"];

  // 删除时间
  google.protobuf.Timestamp deleted_at = 4 [(tagger.tags) = "gorm:\"column:deleted_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:删除时间\" json:\"deleted_at,omitempty\"", (operator.v1.go_name) = "DeletedAt"];

  // 创建者ID
  optional uint32 created_by = 5 [(tagger.tags) = "gorm:\"column:created_by;type:bigint;comment:创建者ID\" json:\"created_by,omitempty\"", (operator.v1.go_name) = "CreatedBy"];

  // 更新者ID
  optional uint32 updated_by = 6 [(tagger.tags) = "gorm:\"column:updated_by;type:bigint;comment:更新者ID\" json:\"updated_by,omitempty\"", (operator.v1.go_name) = "UpdatedBy"];

  // 删除者ID
  optional uint32 deleted_by = 7 [(tagger.tags) = "gorm:\"column:deleted_by;type:bigint;comment:删除者ID\" json:\"deleted_by,omitempty\"", (operator.v1.go_name) = "DeletedBy"];

  // 租户ID
  optional uint32 tenant_id = 8 [(tagger.tags) = "gorm:\"column:tenant_id;type:bigint;default:0;index:idx_sys_ai_docs_tenant,priority:1;comment:租户ID\" json:\"tenant_id,omitempty\"", (operator.v1.go_name) = "TenantID"];

  // 文档名称
  optional string name = 9 [(tagger.tags) = "gorm:\"column:name;type:varchar(255);comment:文档名称\" json:\"name,omitempty\"", (operator.v1.go_name) = "Name"];

  // 切片数
  optional uint32 chunk_count = 10 [(tagger.tags) = "gorm:\"column:chunk_count;type:bigint;comment:切片数\" json:\"chunk_count,omitempty\"", (operator.v1.go_name) = "ChunkCount"];

  // 状态：READY/FAILED
  optional string status = 11 [(tagger.tags) = "gorm:\"column:status;type:varchar(255);comment:状态：READY/FAILED\" json:\"status,omitempty\"", (operator.v1.go_name) = "Status"];

  // 失败原因
  optional string error_message = 12 [(tagger.tags) = "gorm:\"column:error_message;type:text;comment:失败原因\" json:\"error_message,omitempty\"", (operator.v1.go_name) = "ErrorMessage"];

  // 上传人用户ID
  optional uint32 user_id = 13 [(tagger.tags) = "gorm:\"column:user_id;type:bigint;comment:上传人用户ID\" json:\"user_id,omitempty\"", (operator.v1.go_name) = "UserID"];

  // 所属知识库ID（edge 外键）
  optional uint32 base_id = 14 [(tagger.tags) = "gorm:\"column:base_id;type:bigint;comment:所属知识库ID（edge 外键）\" json:\"base_id,omitempty\"", (operator.v1.go_name) = "BaseID"];
}
