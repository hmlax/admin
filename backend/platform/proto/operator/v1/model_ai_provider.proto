  optional bool is_enabled = 8 [(tagger.tags) = "gorm:\"column:is_enabled;type:boolean;default:true;index:idx_sys_ai_providers_enabled_default,priority:1;comment:是否启用\" json:\"is_enabled,omitempty\"", (operator.v1.go_name) = "IsEnabled"];

