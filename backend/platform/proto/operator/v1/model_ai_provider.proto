  optional string base_url = 12 [(tagger.tags) = "gorm:\"column:base_url;type:varchar(255);comment:云端 OpenAI 兼容 API 地址\" json:\"base_url,omitempty\"", (operator.v1.go_name) = "BaseURL"];

