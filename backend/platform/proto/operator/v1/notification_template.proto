syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";
import "validate/validate.proto";

// 通知模板管理服务（平台管理员；租户由 notification_platform_guard 拒绝）
service NotificationTemplateService {
  // 模板列表（分页，contains 搜索）
  rpc ListNotificationTemplate(pagination.PagingRequest) returns (operator.v1.ListNotificationTemplateResponse) {
  }

  // 模板详情
  rpc GetNotificationTemplate(operator.v1.GetNotificationTemplateRequest) returns (operator.v1.NotificationTemplate) {
  }

  // 新建模板
  rpc CreateNotificationTemplate(operator.v1.CreateNotificationTemplateRequest) returns (operator.v1.NotificationTemplate) {
  }

  // 更新模板（CRUD 请求体必须包 {data:{...}}，见仓铁律）
  rpc UpdateNotificationTemplate(operator.v1.UpdateNotificationTemplateRequest) returns (google.protobuf.Empty) {
  }

  // 删除模板
  rpc DeleteNotificationTemplate(operator.v1.DeleteNotificationTemplateRequest) returns (google.protobuf.Empty) {
  }

  // 试渲染：按变量集渲染指定模板，返回标题与正文（管理页预览用，不产生投递）
  rpc RenderNotificationTemplate(operator.v1.RenderNotificationTemplateRequest) returns (operator.v1.RenderNotificationTemplateResponse) {
  }
}

// 通知模板：可复用的标题/正文占位模板（{{var}}），平台全局、code 全局唯一。
message NotificationTemplate {
  optional uint32 id = 1;
  optional string name = 2 [(validate.rules).string = {min_len: 1, max_len: 100}];
  // 模板编码，发送方以 template_code 引用；全局唯一，仅限字母数字与下划线/连字符
  optional string code = 3 [(validate.rules).string = {pattern: "^[A-Za-z0-9_-]{1,64}$"}];
  // 标题模板，支持 {{var}} 占位符；未识别占位符在渲染时报错
  optional string title_template = 4 [(validate.rules).string = {min_len: 1, max_len: 500}];
  // 正文模板，支持 {{var}} 占位符
  optional string content_template = 5 [(validate.rules).string = {min_len: 1, max_len: 20000}];
  optional bool is_enabled = 6;
  optional string remark = 7 [(validate.rules).string.max_len = 500];
  optional google.protobuf.Timestamp created_at = 14;
  optional google.protobuf.Timestamp updated_at = 15;
}

message GetNotificationTemplateRequest {
  oneof query_by {
    uint32 id = 1;
    string code = 2;
  }
}

message CreateNotificationTemplateRequest {
  NotificationTemplate data = 1;
}

message UpdateNotificationTemplateRequest {
  uint32 id = 1;
  NotificationTemplate data = 2;
  // 字段掩码：留空更新全部字段
  optional google.protobuf.FieldMask update_mask = 3;
}
message DeleteNotificationTemplateRequest {
  uint32 id = 1;
}

message ListNotificationTemplateResponse {
  uint64 total = 1;
  repeated NotificationTemplate items = 2;
}

// 按变量集试渲染（管理页预览；发送不经过这里）
message RenderNotificationTemplateRequest {
  // 被渲染的模板 ID
  uint32 id = 1;
  // 变量集：占位符名 → 值；模板引用了变量集里没有的占位符时整个渲染报错
  map<string, string> variables = 2;
}

message RenderNotificationTemplateResponse {
  string title = 1;
  string content = 2;
}
