syntax = "proto3";

package operator.v1;

option go_package = "go-admin/platform/pb/operator;operatorpb";

import "google/protobuf/timestamp.proto";
import "operator/v1/persistence.proto";
import "tagger/tagger.proto";

// AI 知识库切片
message SysAiChunks {
  option (operator.v1.model) = {
    entity: "AiChunk"
    relations: { name: "AiDoc" target: "SysAiDocs" foreign_key: "DocID" references: "ID" many: false }
  };

  // id
  uint32 id = 1 [(tagger.tags) = "gorm:\"column:id;size:32;primaryKey;autoIncrement;not null;comment:id\" json:\"id,omitempty\"", (operator.v1.go_name) = "ID"];

  // 创建时间
  google.protobuf.Timestamp created_at = 2 [(tagger.tags) = "gorm:\"column:created_at;autoCreateTime:false;autoUpdateTime:false;type:timestamp;comment:创建时间\" json:\"created_at,omitempty\"", (operator.v1.go_name) = "CreatedAt"];

  // 租户ID
  optional uint32 tenant_id = 3 [(tagger.tags) = "gorm:\"column:tenant_id;type:bigint;default:0;comment:租户ID\" json:\"tenant_id,omitempty\"", (operator.v1.go_name) = "TenantID"];

  // 切片文本
  optional string content = 4 [(tagger.tags) = "gorm:\"column:content;type:text;comment:切片文本\" json:\"content,omitempty\"", (operator.v1.go_name) = "Content"];

  // 切片序号
  optional uint32 chunk_index = 5 [(tagger.tags) = "gorm:\"column:chunk_index;type:bigint;comment:切片序号\" json:\"chunk_index,omitempty\"", (operator.v1.go_name) = "ChunkIndex"];

  // 所属文档ID（edge 外键）
  optional uint32 doc_id = 6 [(tagger.tags) = "gorm:\"column:doc_id;type:bigint;comment:所属文档ID（edge 外键）\" json:\"doc_id,omitempty\"", (operator.v1.go_name) = "DocID"];
}
