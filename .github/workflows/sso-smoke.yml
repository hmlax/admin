name: sso-smoke

# OIDC SSO 全流冒烟：真实 Keycloak + postgres + redis + 后端 + e2e 探针。
# 验证：discovery 解析、state 签发、Keycloak 登录表单流、code 交换、JWT 签发、
# state 重放拒绝。覆盖 authentication_sso.go 主链路与 user_repo identifier 查找。

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/operator/internal/service/authentication_sso*.go'
      - 'backend/operator/internal/service/transactional_mail*.go'
      - 'backend/operator/internal/data/sso_state_cache.go'
      - 'backend/operator/internal/data/user_repo.go'
      - 'backend/platform/pkg/mailtext/**'
      - 'backend/admin/**'
      - 'backend/platform/pkg/runtimeconfig/**'
      - 'backend/platform/pkg/rpcbridge/**'
      - 'backend/platform/pkg/security/**'
      - 'backend/platform/scripts/deploy/sso/**'
      - '.github/workflows/sso-smoke.yml'

jobs:
  sso-smoke:
    runs-on: ubuntu-latest

    services:
      nacos:
        image: nacos/nacos-server:v2.4.3
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: 'false'
          JVM_XMS: 128m
          JVM_XMX: 256m
          JVM_XMN: 64m
        ports:
          - 8848:8848
          - 9848:9848
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness"
          --health-interval 2s --health-timeout 3s --health-retries 60
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '*Abcd123456'
          POSTGRES_DB: gwa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 配置里的 hostname（postgres/redis）映射到本机 service 端口
      - name: Map service hostnames + redis-tools
        run: |
          sudo sh -c 'echo "127.0.0.1 postgres redis" >> /etc/hosts'
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools

      - name: Start redis (requirepass) + Keycloak
        run: |
          docker run -d --name redis -p 127.0.0.1:6379:6379 \
            redis:7-alpine redis-server --requirepass '*Abcd123456'
          docker run -d --name keycloak -p 127.0.0.1:8081:8080 \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.0 start-dev
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "keycloak ready (last probe: $code)"

      - name: Init Keycloak (realm/client/user)
        run: node backend/platform/scripts/deploy/sso/setup-keycloak.mjs
        env:
          KC_BASE_URL: http://127.0.0.1:8081

      - name: Build backend
        run: |
          cd backend
          go build -o /tmp/gwa-operator ./operator/cmd/server
          go build -o /tmp/gwa-admin ./admin

      - name: Publish Nacos startup configuration
        run: python3 backend/platform/scripts/deploy/sso/publish-test-nacos.py

      - name: Start backend
        env:
          NACOS_ADDR: http://127.0.0.1:8848
          NACOS_GROUP: GO_ADMIN_SSO_CI
        run: |
          cd backend
          /tmp/gwa-operator &> /tmp/operator.log &
          /tmp/gwa-admin &> /tmp/backend.log &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7788/admin/v1/sso/login-info || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "backend ready (last probe: $code)"

      - name: SSO smoke e2e
        run: node backend/platform/scripts/deploy/sso/sso-e2e.mjs
        env:
          BASE_URL: http://localhost:7788
          KC_BASE_URL: http://127.0.0.1:8081
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: '*Abcd123456'

      - name: Dump backend log on failure
        if: failure()
        run: tail -80 /tmp/backend.log
