services:
  platform-admin:
    image: go-admin/platform-admin:local
    build:
      context: .
      args:
        ADMIN_APP: platform
        FRONTEND_CONFIG_REVISION: ${FRONTEND_CONFIG_REVISION:?set the paired frontend configuration revision}
      secrets:
        - frontend_aes_key
    ports:
      - '127.0.0.1:15888:8080'
    environment:
      ADMIN_API_UPSTREAM: ${ADMIN_API_UPSTREAM:-http://host.docker.internal:7788}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  merchant-admin:
    image: go-admin/merchant-admin:local
    build:
      context: .
      args:
        ADMIN_APP: merchant
        FRONTEND_CONFIG_REVISION: ${FRONTEND_CONFIG_REVISION:?set the paired frontend configuration revision}
      secrets:
        - frontend_aes_key
    ports:
      - '127.0.0.1:15889:8080'
    environment:
      MERCHANT_CODE: ${MERCHANT_CODE:-}
      ADMIN_API_UPSTREAM: ${ADMIN_API_UPSTREAM:-http://host.docker.internal:7788}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

secrets:
  frontend_aes_key:
    environment: VITE_AES_KEY
